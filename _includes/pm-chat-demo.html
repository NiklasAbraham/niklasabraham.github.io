{% raw %}<link rel="stylesheet" href="/assets/pm-chat-demo/katex-fonts.css"><template shadowrootmode="open"><link rel="stylesheet" href="/assets/pm-chat-demo/pm-chat-demo.css"><div class="pmd-root"><div class="kchat pmd"><input type="radio" id="pmd-r0" class="pmd-radio" aria-label="1: Classifier-free guidance, formula &amp; plot" name="pmd-tab" checked="" value="guidance"/><input type="radio" id="pmd-r1" class="pmd-radio" aria-label="2: Flow matching, animation" name="pmd-tab" value="flow-matching"/><input type="radio" id="pmd-r2" class="pmd-radio" aria-label="3: AlphaFold 3, protein in 3D" name="pmd-tab" value="alphafold3"/><input type="radio" id="pmd-r3" class="pmd-radio" aria-label="4: Training-data extraction, cited answer" name="pmd-tab" value="extraction"/><nav class="pmd-bar" aria-label="Sample papers"><div class="pmd-bar-head"><span class="kc-brand-mark"></span><span class="pmd-bar-title">Knowledge Chat</span><span class="pmd-bar-note">4<!-- --> sample papers · one question each · pick one</span></div><div class="pmd-tabs"><label for="pmd-r0" data-i="0" class="pmd-tab"><span class="pmd-num">1</span><span class="pmd-tab-text"><span class="pmd-tab-title">Classifier-free guidance</span><span class="pmd-tab-kind"><i aria-hidden="true">∑</i>formula &amp; plot</span></span></label><label for="pmd-r1" data-i="1" class="pmd-tab"><span class="pmd-num">2</span><span class="pmd-tab-text"><span class="pmd-tab-title">Flow matching</span><span class="pmd-tab-kind"><i aria-hidden="true">▶</i>animation</span></span></label><label for="pmd-r2" data-i="2" class="pmd-tab"><span class="pmd-num">3</span><span class="pmd-tab-text"><span class="pmd-tab-title">AlphaFold 3</span><span class="pmd-tab-kind"><i aria-hidden="true">⬢</i>protein in 3D</span></span></label><label for="pmd-r3" data-i="3" class="pmd-tab"><span class="pmd-num">4</span><span class="pmd-tab-text"><span class="pmd-tab-title">Training-data extraction</span><span class="pmd-tab-kind"><i aria-hidden="true">❝</i>cited answer</span></span></label></div></nav><main class="kc-main"><section class="pmd-panel" data-i="0" aria-label="1 of 4: Classifier-Free Diffusion Guidance"><header class="kc-topbar"><div class="kc-title"><h1>Classifier-free guidance</h1></div><span class="kc-model-pill" title="Model that wrote this answer">Claude Code</span><span class="pmd-step"><label for="pmd-r3" class="pmd-arrow" title="Previous paper" aria-hidden="true">‹</label><span class="pmd-of">1<!-- --> / <!-- -->4</span><label for="pmd-r1" class="pmd-arrow" title="Next paper" aria-hidden="true">›</label></span></header><div class="kc-scroll"><div class="thread"><div class="pmd-paper"><span class="kc-kicker">In the library</span><h2><a href="https://doi.org/10.48550/arXiv.2207.12598" target="_blank" rel="noopener noreferrer">Classifier-Free Diffusion Guidance</a></h2><div class="pmd-paper-meta">Ho &amp; Salimans · 2022</div><p>Classifier-free guidance eliminates the need for a separately trained classifier in guided diffusion model sampling.</p></div><div class="msg user"><div class="bubble-row"><div class="user-text">How does classifier-free guidance combine the conditional and unconditional scores, and why does a larger guidance weight trade diversity for fidelity? Answer in three short paragraphs with the key formula.</div></div></div><div class="msg assistant"><div class="kc-section"><div class="kc-md"><p>In <a href="https://doi.org/10.48550/arXiv.2207.12598" target="_blank" rel="noreferrer">Classifier-Free Diffusion Guidance</a>, Ho and Salimans use a single network <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>ϵ</mi><mi>θ</mi></msub></mrow><annotation encoding="application/x-tex">\epsilon_\theta</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5806em;vertical-align:-0.15em"></span><span class="mord"><span class="mord mathnormal">ϵ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0278em">θ</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em"><span></span></span></span></span></span></span></span></span></span> to predict noise both with and without the class label. During training, the label <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>c</mi></mrow><annotation encoding="application/x-tex">c</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em"></span><span class="mord mathnormal">c</span></span></span></span> is replaced by a null token <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∅</mi></mrow><annotation encoding="application/x-tex">\varnothing</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6633em;vertical-align:-0.0817em"></span><span class="mord amsrm">∅</span></span></span></span> with probability <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>p</mi><mtext>uncond</mtext></msub></mrow><annotation encoding="application/x-tex">p_{\text{uncond}}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em"></span><span class="mord"><span class="mord mathnormal">p</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord mtight">uncond</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em"><span></span></span></span></span></span></span></span></span></span>, which is around 0.1–0.2 in their experiments. At sampling time, each step combines the conditional and unconditional predictions linearly:</p>&#10;<span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mover accent="true"><mi>ϵ</mi><mo>~</mo></mover><mi>θ</mi></msub><mo stretchy="false">(</mo><msub><mi>z</mi><mi>λ</mi></msub><mo separator="true">,</mo><mi>c</mi><mo stretchy="false">)</mo><mo>=</mo><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mi>w</mi><mo stretchy="false">)</mo><mtext> </mtext><msub><mi>ϵ</mi><mi>θ</mi></msub><mo stretchy="false">(</mo><msub><mi>z</mi><mi>λ</mi></msub><mo separator="true">,</mo><mi>c</mi><mo stretchy="false">)</mo><mo>−</mo><mi>w</mi><mtext> </mtext><msub><mi>ϵ</mi><mi>θ</mi></msub><mo stretchy="false">(</mo><msub><mi>z</mi><mi>λ</mi></msub><mo stretchy="false">)</mo><mi mathvariant="normal">.</mi></mrow><annotation encoding="application/x-tex">\tilde\epsilon_\theta(z_\lambda, c) = (1+w)\,\epsilon_\theta(z_\lambda, c) - w\,\epsilon_\theta(z_\lambda).</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em"></span><span class="mord"><span class="mord accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6679em"><span style="top:-3em"><span class="pstrut" style="height:3em"></span><span class="mord mathnormal">ϵ</span></span><span style="top:-3.35em"><span class="pstrut" style="height:3em"></span><span class="accent-body" style="left:-0.1944em"><span class="mord">~</span></span></span></span></span></span></span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0278em">θ</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em"><span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.044em">z</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em"><span style="top:-2.55em;margin-left:-0.044em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">λ</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em"><span></span></span></span></span></span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em"></span><span class="mord mathnormal">c</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em"></span><span class="mopen">(</span><span class="mord">1</span><span class="mspace" style="margin-right:0.2222em"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em"></span><span class="mord mathnormal" style="margin-right:0.0269em">w</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.1667em"></span><span class="mord"><span class="mord mathnormal">ϵ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0278em">θ</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em"><span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.044em">z</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em"><span style="top:-2.55em;margin-left:-0.044em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">λ</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em"><span></span></span></span></span></span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em"></span><span class="mord mathnormal">c</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2222em"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em"></span><span class="mord mathnormal" style="margin-right:0.0269em">w</span><span class="mspace" style="margin-right:0.1667em"></span><span class="mord"><span class="mord mathnormal">ϵ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0278em">θ</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em"><span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.044em">z</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em"><span style="top:-2.55em;margin-left:-0.044em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">λ</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em"><span></span></span></span></span></span></span><span class="mclose">)</span><span class="mord">.</span></span></span></span></span>&#10;<p>The noise prediction is a scaled negative score, <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ϵ</mi><mo>≈</mo><mo>−</mo><msub><mi>σ</mi><mi>λ</mi></msub><msub><mi mathvariant="normal">∇</mi><mi>z</mi></msub><mi>log</mi><mo>⁡</mo><mi>p</mi><mo stretchy="false">(</mo><msub><mi>z</mi><mi>λ</mi></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\epsilon \approx -\sigma_\lambda \nabla_z \log p(z_\lambda)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4831em"></span><span class="mord mathnormal">ϵ</span><span class="mspace" style="margin-right:0.2778em"></span><span class="mrel">≈</span><span class="mspace" style="margin-right:0.2778em"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em"></span><span class="mord">−</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em">σ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">λ</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em"><span></span></span></span></span></span></span><span class="mord"><span class="mord">∇</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.044em">z</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.1667em"></span><span class="mop">lo<span style="margin-right:0.0139em">g</span></span><span class="mspace" style="margin-right:0.1667em"></span><span class="mord mathnormal">p</span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.044em">z</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em"><span style="top:-2.55em;margin-left:-0.044em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">λ</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em"><span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span>. In score terms, the guided score is therefore</p>&#10;<span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mi>w</mi><mo stretchy="false">)</mo><mi mathvariant="normal">∇</mi><mi>log</mi><mo>⁡</mo><mi>p</mi><mo stretchy="false">(</mo><mi>z</mi><mi mathvariant="normal">∣</mi><mi>c</mi><mo stretchy="false">)</mo><mo>−</mo><mi>w</mi><mi mathvariant="normal">∇</mi><mi>log</mi><mo>⁡</mo><mi>p</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mi mathvariant="normal">∇</mi><mi>log</mi><mo>⁡</mo><mi>p</mi><mo stretchy="false">(</mo><mi>z</mi><mi mathvariant="normal">∣</mi><mi>c</mi><mo stretchy="false">)</mo><mo>+</mo><mi>w</mi><mtext> </mtext><mi mathvariant="normal">∇</mi><mi>log</mi><mo>⁡</mo><msub><mi>p</mi><mi>i</mi></msub><mo stretchy="false">(</mo><mi>c</mi><mi mathvariant="normal">∣</mi><mi>z</mi><mo stretchy="false">)</mo><mo separator="true">,</mo></mrow><annotation encoding="application/x-tex">(1+w)\nabla\log p(z|c) - w\nabla\log p(z) = \nabla\log p(z|c) + w\,\nabla\log p_i(c|z),</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em"></span><span class="mopen">(</span><span class="mord">1</span><span class="mspace" style="margin-right:0.2222em"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em"></span><span class="mord mathnormal" style="margin-right:0.0269em">w</span><span class="mclose">)</span><span class="mord">∇</span><span class="mspace" style="margin-right:0.1667em"></span><span class="mop">lo<span style="margin-right:0.0139em">g</span></span><span class="mspace" style="margin-right:0.1667em"></span><span class="mord mathnormal">p</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.044em">z</span><span class="mord">∣</span><span class="mord mathnormal">c</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2222em"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em"></span><span class="mord mathnormal" style="margin-right:0.0269em">w</span><span class="mord">∇</span><span class="mspace" style="margin-right:0.1667em"></span><span class="mop">lo<span style="margin-right:0.0139em">g</span></span><span class="mspace" style="margin-right:0.1667em"></span><span class="mord mathnormal">p</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.044em">z</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em"></span><span class="mord">∇</span><span class="mspace" style="margin-right:0.1667em"></span><span class="mop">lo<span style="margin-right:0.0139em">g</span></span><span class="mspace" style="margin-right:0.1667em"></span><span class="mord mathnormal">p</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.044em">z</span><span class="mord">∣</span><span class="mord mathnormal">c</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2222em"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em"></span><span class="mord mathnormal" style="margin-right:0.0269em">w</span><span class="mspace" style="margin-right:0.1667em"></span><span class="mord">∇</span><span class="mspace" style="margin-right:0.1667em"></span><span class="mop">lo<span style="margin-right:0.0139em">g</span></span><span class="mspace" style="margin-right:0.1667em"></span><span class="mord"><span class="mord mathnormal">p</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em"><span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord mathnormal">c</span><span class="mord">∣</span><span class="mord mathnormal" style="margin-right:0.044em">z</span><span class="mclose">)</span><span class="mpunct">,</span></span></span></span></span>&#10;<p>where <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>p</mi><mi>i</mi></msub><mo stretchy="false">(</mo><mi>c</mi><mi mathvariant="normal">∣</mi><mi>z</mi><mo stretchy="false">)</mo><mo>∝</mo><mi>p</mi><mo stretchy="false">(</mo><mi>z</mi><mi mathvariant="normal">∣</mi><mi>c</mi><mo stretchy="false">)</mo><mi mathvariant="normal">/</mi><mi>p</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">p_i(c|z) \propto p(z|c)/p(z)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em"></span><span class="mord"><span class="mord mathnormal">p</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em"><span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord mathnormal">c</span><span class="mord">∣</span><span class="mord mathnormal" style="margin-right:0.044em">z</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em"></span><span class="mrel">∝</span><span class="mspace" style="margin-right:0.2778em"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em"></span><span class="mord mathnormal">p</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.044em">z</span><span class="mord">∣</span><span class="mord mathnormal">c</span><span class="mclose">)</span><span class="mord">/</span><span class="mord mathnormal">p</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.044em">z</span><span class="mclose">)</span></span></span></span> is an &quot;implicit classifier&quot; given by Bayes&#x27; rule. This has the same form as classifier guidance, except that the classifier gradient comes from the difference between the two generative scores, so no separate classifier is trained.</p>&#10;<p>The trade-off follows from the density that the guided score targets: <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mover accent="true"><mi>p</mi><mo>~</mo></mover><mi>w</mi></msub><mo stretchy="false">(</mo><mi>z</mi><mi mathvariant="normal">∣</mi><mi>c</mi><mo stretchy="false">)</mo><mo>∝</mo><mi>p</mi><mo stretchy="false">(</mo><mi>z</mi><mi mathvariant="normal">∣</mi><mi>c</mi><mo stretchy="false">)</mo><mtext> </mtext><msub><mi>p</mi><mi>i</mi></msub><mo stretchy="false">(</mo><mi>c</mi><mi mathvariant="normal">∣</mi><mi>z</mi><msup><mo stretchy="false">)</mo><mi>w</mi></msup><mo>∝</mo><mi>p</mi><mo stretchy="false">(</mo><mi>z</mi><mi mathvariant="normal">∣</mi><mi>c</mi><msup><mo stretchy="false">)</mo><mrow><mn>1</mn><mo>+</mo><mi>w</mi></mrow></msup><mi mathvariant="normal">/</mi><mi>p</mi><mo stretchy="false">(</mo><mi>z</mi><msup><mo stretchy="false">)</mo><mi>w</mi></msup></mrow><annotation encoding="application/x-tex">\tilde p_w(z|c) \propto p(z|c)\,p_i(c|z)^w \propto p(z|c)^{1+w}/p(z)^w</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em"></span><span class="mord"><span class="mord accent"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.6679em"><span style="top:-3em"><span class="pstrut" style="height:3em"></span><span class="mord mathnormal">p</span></span><span style="top:-3.35em"><span class="pstrut" style="height:3em"></span><span class="accent-body" style="left:-0.1667em"><span class="mord">~</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.1944em"><span></span></span></span></span></span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0269em">w</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em"><span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.044em">z</span><span class="mord">∣</span><span class="mord mathnormal">c</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em"></span><span class="mrel">∝</span><span class="mspace" style="margin-right:0.2778em"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em"></span><span class="mord mathnormal">p</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.044em">z</span><span class="mord">∣</span><span class="mord mathnormal">c</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.1667em"></span><span class="mord"><span class="mord mathnormal">p</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em"><span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord mathnormal">c</span><span class="mord">∣</span><span class="mord mathnormal" style="margin-right:0.044em">z</span><span class="mclose"><span class="mclose">)</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6644em"><span style="top:-3.063em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0269em">w</span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em"></span><span class="mrel">∝</span><span class="mspace" style="margin-right:0.2778em"></span></span><span class="base"><span class="strut" style="height:1.0641em;vertical-align:-0.25em"></span><span class="mord mathnormal">p</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.044em">z</span><span class="mord">∣</span><span class="mord mathnormal">c</span><span class="mclose"><span class="mclose">)</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em"><span style="top:-3.063em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">1</span><span class="mbin mtight">+</span><span class="mord mathnormal mtight" style="margin-right:0.0269em">w</span></span></span></span></span></span></span></span></span><span class="mord">/</span><span class="mord mathnormal">p</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.044em">z</span><span class="mclose"><span class="mclose">)</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6644em"><span style="top:-3.063em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0269em">w</span></span></span></span></span></span></span></span></span></span></span>. Raising <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>p</mi><mi>i</mi></msub><mo stretchy="false">(</mo><mi>c</mi><mi mathvariant="normal">∣</mi><mi>z</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">p_i(c|z)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em"></span><span class="mord"><span class="mord mathnormal">p</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em"><span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord mathnormal">c</span><span class="mord">∣</span><span class="mord mathnormal" style="margin-right:0.044em">z</span><span class="mclose">)</span></span></span></span> to the power <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>w</mi><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">w&gt;0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5782em;vertical-align:-0.0391em"></span><span class="mord mathnormal" style="margin-right:0.0269em">w</span><span class="mspace" style="margin-right:0.2778em"></span><span class="mrel">&gt;</span><span class="mspace" style="margin-right:0.2778em"></span></span><span class="base"><span class="strut" style="height:0.6444em"></span><span class="mord">0</span></span></span></span> tilts probability mass towards regions where the class is easiest to identify. Those are the prototypical, high-density parts of the class-conditional distribution. Atypical samples, which also fit other classes, are suppressed. The effect is similar to low-temperature sampling or GAN truncation: individual samples look more like their class (higher Inception Score) while within-class variety shrinks (FID eventually gets worse). The paper&#x27;s ImageNet results show this:</p>&#10;<ul>&#10;<li><strong>64×64:</strong> the best FID is 1.55 at <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>w</mi><mo>=</mo><mn>0.1</mn></mrow><annotation encoding="application/x-tex">w=0.1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em"></span><span class="mord mathnormal" style="margin-right:0.0269em">w</span><span class="mspace" style="margin-right:0.2778em"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em"></span></span><span class="base"><span class="strut" style="height:0.6444em"></span><span class="mord">0.1</span></span></span></span>, and IS rises steadily to 260.2 at <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>w</mi><mo>=</mo><mn>4</mn></mrow><annotation encoding="application/x-tex">w=4</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em"></span><span class="mord mathnormal" style="margin-right:0.0269em">w</span><span class="mspace" style="margin-right:0.2778em"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em"></span></span><span class="base"><span class="strut" style="height:0.6444em"></span><span class="mord">4</span></span></span></span>.</li>&#10;<li><strong>128×128:</strong> the best FID is 2.43 at <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>w</mi><mo>=</mo><mn>0.3</mn></mrow><annotation encoding="application/x-tex">w=0.3</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em"></span><span class="mord mathnormal" style="margin-right:0.0269em">w</span><span class="mspace" style="margin-right:0.2778em"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em"></span></span><span class="base"><span class="strut" style="height:0.6444em"></span><span class="mord">0.3</span></span></span></span>. At <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>w</mi><mo>=</mo><mn>4</mn></mrow><annotation encoding="application/x-tex">w=4</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em"></span><span class="mord mathnormal" style="margin-right:0.0269em">w</span><span class="mspace" style="margin-right:0.2778em"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em"></span></span><span class="base"><span class="strut" style="height:0.6444em"></span><span class="mord">4</span></span></span></span>, IS is 421 but FID degrades to 21.5.</li>&#10;</ul>&#10;<p>This explanation is a heuristic. The authors stress that an unconstrained network produces a vector field that is not the gradient of any function, so <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mover accent="true"><mi>ϵ</mi><mo>~</mo></mover></mrow><annotation encoding="application/x-tex">\tilde\epsilon</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6679em"></span><span class="mord accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6679em"><span style="top:-3em"><span class="pstrut" style="height:3em"></span><span class="mord mathnormal">ϵ</span></span><span style="top:-3.35em"><span class="pstrut" style="height:3em"></span><span class="accent-body" style="left:-0.1944em"><span class="mord">~</span></span></span></span></span></span></span></span></span></span> is not exactly the gradient of any classifier. Applying the tilt separately at every noise level also does not give exact samples from <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mover accent="true"><mi>p</mi><mo>~</mo></mover><mi>w</mi></msub></mrow><annotation encoding="application/x-tex">\tilde p_w</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8623em;vertical-align:-0.1944em"></span><span class="mord"><span class="mord accent"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.6679em"><span style="top:-3em"><span class="pstrut" style="height:3em"></span><span class="mord mathnormal">p</span></span><span style="top:-3.35em"><span class="pstrut" style="height:3em"></span><span class="accent-body" style="left:-0.1667em"><span class="mord">~</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.1944em"><span></span></span></span></span></span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0269em">w</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em"><span></span></span></span></span></span></span></span></span></span> at <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>t</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">t=0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6151em"></span><span class="mord mathnormal">t</span><span class="mspace" style="margin-right:0.2778em"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em"></span></span><span class="base"><span class="strut" style="height:0.6444em"></span><span class="mord">0</span></span></span></span>. <a href="https://arxiv.org/abs/2510.01378" target="_blank" rel="noreferrer">Selective Underfitting in Diffusion Models</a> adds a related point. On the noisy points seen during training, the conditional and unconditional scores barely differ. The difference that drives guidance appears in regions sampling trajectories reach but training never covered, where the two predictions diverge. So the size of the effect depends on how each model generalises there, not just on Bayes&#x27; rule. The cost is two forward passes per sampling step.</p></div><div class="pmd-island pmd-island-concept" data-kind="concept" data-type="formula" data-key="1hw21jn" data-payload="{&quot;spec&quot;:{&quot;type&quot;:&quot;formula&quot;,&quot;title&quot;:&quot;Classifier-free guidance as conditional score plus implicit classifier gradient&quot;,&quot;caption&quot;:&quot;The guided noise prediction (1+w)ε(z,c) − wε(z) corresponds to the conditional score plus w times the gradient of an implicit classifier, so raising w sharpens samples toward the condition c, increasing fidelity at the cost of diversity.&quot;,&quot;main_latex&quot;:&quot;\\tilde{\\epsilon}(z,c) = (1+w)\\,\\epsilon(z,c) - w\\,\\epsilon(z) \\;\\Longleftrightarrow\\; \\tilde{s}(z,c) = \\nabla_z \\log p(z\\mid c) + w\\,\\nabla_z \\log p_i(c\\mid z)&quot;,&quot;steps&quot;:[{&quot;latex&quot;:&quot;\\epsilon(z,c) \\approx -\\sigma\\,\\nabla_z \\log p(z\\mid c), \\qquad \\epsilon(z) \\approx -\\sigma\\,\\nabla_z \\log p(z)&quot;,&quot;explanation&quot;:&quot;Noise prediction is, up to a factor of the noise scale σ, the negative score of the corresponding distribution.&quot;},{&quot;latex&quot;:&quot;\\tilde{\\epsilon}(z,c) \\approx -\\sigma\\left[(1+w)\\nabla_z \\log p(z\\mid c) - w\\,\\nabla_z \\log p(z)\\right]&quot;,&quot;explanation&quot;:&quot;Substituting these into the guided noise gives the same linear combination of conditional and unconditional scores.&quot;},{&quot;latex&quot;:&quot;\\tilde{s}(z,c) = \\nabla_z \\log p(z\\mid c) + w\\left[\\nabla_z \\log p(z\\mid c) - \\nabla_z \\log p(z)\\right]&quot;,&quot;explanation&quot;:&quot;Regrouping, with s̃ = −ε̃/σ, shows the guidance is the conditional score plus w times the difference of the two scores.&quot;},{&quot;latex&quot;:&quot;p_i(c\\mid z) \\propto \\frac{p(z\\mid c)}{p(z)} \\;\\Rightarrow\\; \\nabla_z \\log p_i(c\\mid z) = \\nabla_z \\log p(z\\mid c) - \\nabla_z \\log p(z)&quot;,&quot;explanation&quot;:&quot;By Bayes&#x27; rule, that score difference is exactly the gradient of an implicit classifier, since p(c) does not depend on z.&quot;},{&quot;latex&quot;:&quot;\\tilde{s}(z,c) = \\nabla_z \\log p(z\\mid c) + w\\,\\nabla_z \\log p_i(c\\mid z)&quot;,&quot;explanation&quot;:&quot;A larger w up-weights the implicit classifier and pushes samples toward regions where c is highly identifiable, which raises fidelity and narrows diversity.&quot;}]},&quot;label&quot;:&quot;Guided noise prediction and score&quot;,&quot;foot&quot;:true}"><img class="pmd-still" src="/assets/pm-chat-demo/data/cards/1hw21jn.webp" width="643" height="765" alt="Concept card: Classifier-free guidance as conditional score plus implicit classifier gradient" loading="lazy" decoding="async"/></div><div class="pmd-island pmd-island-concept" data-kind="concept" data-type="graph" data-key="ejx65t" data-payload="{&quot;spec&quot;:{&quot;type&quot;:&quot;graph&quot;,&quot;title&quot;:&quot;FID rises as guidance weight w increases (ImageNet)&quot;,&quot;caption&quot;:&quot;Reported FID values only: the best FID at 64x64 (w=0.1) and at 128x128 (w=0.3), and the 128x128 FID at w=4. Lower FID is better. Over the same range of w, IS rises: 64x64 reaches 260.2 at w=4, and 128x128 reaches 421 at w=4. Larger w therefore gives higher fidelity (IS) but lower diversity (worse FID).&quot;,&quot;chart_type&quot;:&quot;bars&quot;,&quot;x_label&quot;:&quot;Model and guidance weight (w)&quot;,&quot;y_label&quot;:&quot;FID (lower is better)&quot;,&q /span></span></span></span> with an off-the-shelf solver (the paper uses dopri5 or midpoint). Each conditional path is straight, but the learned marginal flow is not guaranteed to be straight. In practice its trajectories are much less curved than diffusion paths, which gives faster training and good samples with fewer function evaluations; the paper shows this on ImageNet at 32, 64 and 128 resolution.</p></div><div class="pmd-island pmd-island-concept" data-kind="concept" data-type="2d-anim" data-key="1vvjq6l" data-payload="{&quot;spec&quot;:{&quot;type&quot;:&quot;2d-anim&quot;,&quot;title&quot;:&quot;Flow matching: noise to data along straight ODE paths&quot;,&quot;caption&quot;:&quot;Samples x0 ~ N(0, I) are carried by dφ_t/dt = v_t(φ_t) from t=0 to 1. With conditional OT paths x_t = (1−t)x0 + t x1, each point moves in a straight line with constant target velocity u_t = x1 − x0. The right panel is a schematic of curved diffusion-style paths, which need more integration steps.&quot;,&quot;setup_code&quot;:&quot;var seed = 7;\nfunction rnd() { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; var t = Math.imul(seed ^ (seed &gt;&gt;&gt; 15), 1 | seed); t = (t + Math.imul(t ^ (t &gt;&gt;&gt; 7), 61 | t)) ^ t; return ((t ^ (t &gt;&gt;&gt; 14)) &gt;&gt;&gt; 0) / 4294967296; }\nfunction gauss() { var u = Math.max(1e-6, rnd()), v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.2831853 * v); }\nvar N = 80;\nvar X0 = [], X1 = [];\nfor (var i = 0; i &lt; N; i++) {\n  X0.push([-1.9 + 0.6 * gauss(), 0.6 * gauss()]);\n  var a = rnd() * Math.PI;\n  var p;\n  if (i % 2 === 0) p = [Math.cos(a), Math.sin(a)];\n  else p = [1 - Math.cos(a), 0.5 - Math.sin(a)];\n  X1.push([1.9 + 1.2 * (p[0] - 0.5) + 0.07 * gauss(), 1.2 * (p[1] - 0.25) + 0.07 * gauss()]);\n}\nX0.sort(function (a, b) { return a[1] - b[1]; });\nX1.sort(function (a, b) { return a[1] - b[1]; });\nvar AMP = [];\nfor (var j = 0; j &lt; N; j++) AMP.push((j % 2 ? 1 : -1) * (0.35 + 0.6 * rnd()));\nvar INK = &#x27;#1a1a1d&#x27;;\nfunction clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }\nfunction pos(i, t, k) {\n  var a = X0[i], b = X1[i];\n  var x = (1 - t) * a[0] + t * b[0], y = (1 - t) * a[1] + t * b[1];\n  if (k === 1) {\n    var dx = b[0] - a[0], dy = b[1] - a[1];\n    var L = Math.sqrt(dx * dx + dy * dy) + 1e-6;\n    var o = Math.sin(Math.PI * t) * AMP[i] * 0.6;\n    x += -dy / L * o * 1.0; y += dx / L * o * 1.0;\n  }\n  return [x, y];\n}\nreturn {\n  draw: function (ctx, width, height, time, dt) {\n    ctx.fillStyle = &#x27;#ffffff&#x27;;\n    ctx.fillRect(0, 0, width, height);\n    var period = 9;\n    var tt = time % period;\n    var t = clamp((tt - 1) / 6, 0, 1);\n    var m = 16;\n    var pw = (width - 3 * m) / 2;\n    var top = 56;\n    var ph = Math.min(height - top - 70, pw * 0.7);\n    var titles = [&#x27;Flow matching: straight OT paths&#x27;, &#x27;Diffusion-like paths (schematic)&#x27;];\n    var cols = [&#x27;#7c3aed&#x27;, &#x27;#0284c7&#x27;];\n    for (var k = 0; k &lt; 2; k++) {\n      var ox = m + k * (pw + m), oy = top;\n      var sx = pw / 7.2, sy = ph / 4.4;\n      var cx = ox + pw / 2, cy = oy + ph / 2;\n      var P = function (p) { return [cx + p[0] * sx, cy - p[1] * sy]; };\n      ctx.strokeStyle = &#x27;#d4d4d8&#x27;; ctx.lineWidth = 1;\n      ctx.strokeRect(ox, oy, pw, ph);\n      ctx.fillStyle = INK; ctx.font = &#x27;13px sans-serif&#x27;; ctx.textAlign = &#x27;left&#x27;;\n      ctx.fillText(titles[k], ox, oy - 8);\n      ctx.font = &#x27;12px sans-serif&#x27;;\n      ctx.fillStyle = cols[k];\n      ctx.fillText(&#x27;p_0 = N(0, I)&#x27;, ox + 8, oy + ph - 8);\n      ctx.fillStyle = &#x27;#d97706&#x27;;\n      ctx.textAlign = &#x27;right&#x27;;\n      ctx.fillText(&#x27;data q&#x27;, ox + pw - 8, oy + ph - 8);\n      ctx.textAlign = &#x27;left&#x27;;\n      // faint full paths\n      ctx.lineWidth = 1;\n      for (var i = 0; i &lt; N; i += 2) {\n        ctx.strokeStyle = &#x27;rgba(100,100,110,0.13)&#x27;;\n        ctx.beginPath();\n        var q = P(pos(i, 0, k)); ctx.moveTo(q[0], q[1]);\n        var S = k === 0 ? 1 : 12;\n        for (var s = 1; s &lt;= S; s++) { q = P(pos(i, s / S, k)); ctx.lineTo(q[0], q[1]); }\n        ctx.stroke();\n      }\n      // traversed trails\n      ctx.strokeStyle = k === 0 ? &#x27;rgba(124,58,237,0.35)&#x27; : &#x27;rgba(2,132,199,0.35)&#x27;;\n      for (var i2 = 0; i2 &lt; N; i2 += 2) {\n        ctx.beginPath();\n        var q2 = P(pos(i2, 0, k)); ctx.moveTo(q2[0], q2[1]);\n        var S2 = k === 0 ? 1 : 12;\n        for (var s2 = 1; s2 &lt;= S2; s2++) { q2 = P(pos(i2, t * s2 / S2, k)); ctx.lineTo(q2[0], q2[1]); }\n        ctx.stroke();\n      }\n      // data ghosts\n      ctx.strokeStyle = &#x27;#d97706&#x27;; ctx.lineWidth = 1;\n      for (var g = 0; g &lt; N; g++) {\n        var d = P(X1[g]);\n        ctx.beginPath(); ctx.arc(d[0], d[1], 3.2, 0, 6.2832); ctx.stroke();\n      }\n      // velocity arrows (flow panel)\n      if (k === 0 &amp;&amp; t &gt; 0 &amp;&amp; t &lt; 1) {\n        ctx.strokeStyle = &#x27;#059669&#x27;; ctx.fillStyle = &#x27;#059669&#x27;; ctx.lineWidth = 1.5;\n        for (var v = 3; v &lt; N; v += 10) {\n          var pp = pos(v, t, 0);\n          var ux = (X1[v][0] - X0[v][0]) * 0.3, uy = (X1[v][1] - X0[v][1]) * 0.3;\n          var a0 = P(pp), a1 = P([pp[0] + ux, pp[1] + uy]);\n          ctx.beginPath(); ctx.moveTo(a0[0], a0[1]); ctx.lineTo(a1[0], a1[1]); ctx.stroke();\n          var ang = Math.atan2(a1[1] - a0[1], a1[0] - a0[0]);\n          ctx.beginPath(); ctx.moveTo(a1[0], a1[1]);\n          ctx.lineTo(a1[0] - 6 * Math.cos(ang - 0.4), a1[1] - 6 * Math.sin(ang - 0.4));\n          ctx.lineTo(a1[0] - 6 * Math.cos(ang + 0.4), a1[1] - 6 * Math.sin(ang + 0.4));\n          ctx.closePath(); ctx.fill();\n        }\n      }\n      // points\n      ctx.fillStyle = cols[k];\n      for (var n = 0; n &lt; N; n++) {\n        var c = P(pos(n, t, k));\n        ctx.beginPath(); ctx.arc(c[0], c[1], 3, 0, 6.2832); ctx.fill();\n      }\n    }\n    // time bar\n    var bx = m + 30, bw = width - 2 * m - 60, by = top + ph + 30;\n    ctx.fillStyle = INK; ctx.font = &#x27;12px sans-serif&#x27;; ctx.textAlign = &#x27;left&#x27;;\n    ctx.fillText(&#x27;t&#x27;, m + 8, by + 4);\n    ctx.strokeStyle = &#x27;#a1a1aa&#x27;; ctx.lineWidth = 2;\n    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + bw, by); ctx.stroke();\n    ctx.strokeStyle = &#x27;#7c3aed&#x27;; ctx.lineWidth = 3;\n    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + bw * t, by); ctx.stroke();\n    ctx.fillStyle = &#x27;#7c3aed&#x27;;\n    ctx.beginPath(); ctx.arc(bx + bw * t, by, 5, 0, 6.2832); ctx.fill();\n    ctx.fillStyle = INK;\n    var msg;\n    if (t &lt; 0.02) msg = &#x27;t = 0.00: x0 ~ N(0, I)&#x27;;\n    else if (t &gt; 0.98) msg = &#x27;t = 1.00: φ_1 ≈ samples from q&#x27;;\n    else msg = &#x27;t = &#x27; + t.toFixed(2) + &#x27;: dφ_t/dt = v_t(φ_t),  x_t = (1−t)x0 + t x1,  u_t = x1 − x0&#x27;;\n    ctx.fillText(msg, bx, by + 24);\n    ctx.fillStyle = &#x27;#059669&#x27;;\n    ctx.fillText(&#x27;green arrows: constant velocity u_t&#x27;, bx, by + 42);\n    ctx.fillStyle = INK;\n    ctx.font = &#x27;13px sans-serif&#x27;;\n    ctx.fillText(&#x27;Same pairs (x0, x1); flow matching learns v_t ≈ E[u_t | x_t]&#x27;, m, 22);\n  }\n};&quot;},&quot;label&quot;:&quot;Noise-to-data flow via ODE&quot;,&quot;foot&quot;:true}"><img class="pmd-still" src="/assets/pm-chat-demo/data/cards/1vvjq6l.webp" width="643" height="454" alt="Concept card: Flow matching: noise to data along straight ODE paths" loading="lazy" decoding="async"/></div></div><div class="kc-answer-foot"><span class="kc-kicker">Cited</span><a class="kc-src-chip k-paper" href="https://arxiv.org/abs/2210.02747" target="_blank" rel="noopener noreferrer" title="Flow Matching for Generative Modeling"><span>Flow Matching for Generative Modeling</span></a></div></div></div></div></section><section class="pmd-panel" data-i="2" aria-label="3 of 4: Accurate structure prediction of biomolecular interactions with AlphaFold 3"><header class="kc-topbar"><div class="kc-title"><h1>AlphaFold 3</h1></div><span class="kc-model-pill" title="Model that wrote this answer">Claude Code</span><span class="pmd-step"><label for="pmd-r1" class="pmd-arrow" title="Previous paper" aria-hidden="true">‹</label><span class="pmd-of">3<!-- --> / <!-- -->4</span><label for="pmd-r3" class="pmd-arrow" title="Next paper" aria-hidden="true">›</label></span></header><div class="kc-scroll"><div class="thread"><div class="pmd-paper"><span class="kc-kicker">In the library</span><h2><a href="https://doi.org/10.1038/s41586-024-07487-w" target="_blank" rel="noopener noreferrer">Accurate structure prediction of biomolecular interactions with AlphaFold 3</a></h2><div class="pmd-paper-meta">Abramson, Adler, Dunger et al. · 2024 · Nature</div><p>AlphaFold 3 (AF3) is a unified deep-learning model that predicts the joint 3D structure of biomolecular complexes containing proteins, nucleic acids (DNA/RNA), small-molecule ligands, ions, and covalently modified residues.</p></div><div class="msg user"><div class="bubble-row"><div class="user-text">In two short paragraphs, how does AlphaFold 3 predict the structure of a protein complex? Show the SARS-CoV-2 spike (PDB 6VXX) in 3D with the receptor-binding domains highlighted.</div></div></div><div class="msg assistant"><div class="kc-section"><div class="kc-md"><p><a href="https://doi.org/10.1038/s41586-024-07487-w" target="_blank" rel="noreferrer">AlphaFold 3</a> takes only sequences (and SMILES strings for ligands) as input. It tokenises the complex: one token per standard residue or nucleotide, and one token per atom for ligands and modified residues. A small MSA module (4 blocks with pair-weighted averaging) and template features feed into the <strong>Pairformer</strong>, a stack of 48 blocks. The Pairformer refines a single representation (<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi><mo>×</mo><mn>384</mn></mrow><annotation encoding="application/x-tex">n \times 384</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em"></span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2222em"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em"></span></span><span class="base"><span class="strut" style="height:0.6444em"></span><span class="mord">384</span></span></span></span>) and a pair representation (<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi><mo>×</mo><mi>n</mi><mo>×</mo><mn>128</mn></mrow><annotation encoding="application/x-tex">n \times n \times 128</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em"></span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2222em"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em"></span></span><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em"></span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2222em"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em"></span></span><span class="base"><span class="strut" style="height:0.6444em"></span><span class="mord">128</span></span></span></span>) using triangle updates and attention, and recycles them. In AlphaFold 2 the Evoformer kept updating the MSA representation throughout; here the MSA is used only at the start, and the pair representation carries the information that relates residues within a chain and across chains.</p>&#10;<p>The <strong>diffusion module</strong> then turns these representations into structure. It takes noised atom coordinates and predicts the denoised ones, with no frames, torsion angles or enforced equivariance. At inference it starts from random noise and denoises in about 20 steps. Training at low noise levels teaches local stereochemistry, and training at high noise teaches global arrangement. To stop the model inventing structure in disordered regions, it was also trained on AlphaFold-Multimer v2.3 predictions (cross-distillation). A confidence head trained on &quot;mini-rollout&quot; structures predicts pLDDT, PAE, PDE and ipTM, which are used to rank samples. On protein–protein interfaces it beat AlphaFold-Multimer v2.3 (Wilcoxon <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>P</mi><mo>=</mo><mn>1.8</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>18</mn></mrow></msup></mrow><annotation encoding="application/x-tex">P = 1.8\times10^{-18}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em"></span><span class="mord mathnormal" style="margin-right:0.1389em">P</span><span class="mspace" style="margin-right:0.2778em"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em"></span></span><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em"></span><span class="mord">1.8</span><span class="mspace" style="margin-right:0.2222em"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em"></span></span><span class="base"><span class="strut" style="height:0.8141em"></span><span class="mord">1</span><span class="mord"><span class="mord">0</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em"><span style="top:-3.063em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">−</span><span class="mord mtight">18</span></span></span></span></span></span></span></span></span></span></span></span>, <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi><mo>=</mo><mn>1,064</mn></mrow><annotation encoding="application/x-tex">n = 1{,}064</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em"></span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2778em"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em"></span></span><span class="base"><span class="strut" style="height:0.8389em;vertical-align:-0.1944em"></span><span class="mord">1</span><span class="mord"><span class="mpunct">,</span></span><span class="mord">064</span></span></span></span> clusters). For antibody–antigen complexes the gain (<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>P</mi><mo>=</mo><mn>6.5</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>5</mn></mrow></msup></mrow><annotation encoding="application/x-tex">P = 6.5\times10^{-5}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em"></span><span class="mord mathnormal" style="margin-right:0.1389em">P</span><span class="mspace" style="margin-right:0.2778em"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em"></span></span><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em"></span><span class="mord">6.5</span><span class="mspace" style="margin-right:0.2222em"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em"></span></span><span class="base"><span class="strut" style="height:0.8141em"></span><span class="mord">1</span><span class="mord"><span class="mord">0</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em"><span style="top:-3.063em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">−</span><span class="mord mtight">5</span></span></span></span></span></span></span></span></span></span></span></span>) depended on drawing many seeds (1,000 in that benchmark) and ranking them by confidence.</p>&#10;<!--$--><div class="pmd-island pmd-island-structure" data-kind="structure" data-type="structure" data-key="v0u4cp" data-payload="{&quot;title&quot;: &quot;SARS-CoV-2 spike trimer, closed prefusion state (6VXX)&quot;,&#10; &quot;models&quot;: [{&quot;pdb&quot;: &quot;6VXX&quot;, &quot;color&quot;: &quot;grey&quot;, &quot;opacity&quot;: 0.85}],&#10; &quot;highlights&quot;: [&#10;   {&quot;label&quot;: &quot;RBD (chain A)&quot;, &quot;chain&quot;: &quot;A&quot;, &quot;resi&quot;: &quot;319-541&quot;, &quot;color&quot;: &quot;warm&quot;},&#10;   {&quot;label&quot;: &quot;RBD (chain B)&quot;, &quot;chain&quot;: &quot;B&quot;, &quot;resi&quot;: &quot;319-541&quot;, &quot;color&quot;: &quot;blue&quot;},&#10;   {&quot;label&quot;: &quot;RBD (chain C)&quot;, &quot;chain&quot;: &quot;C&quot;, &quot;resi&quot;: &quot;319-541&quot;, &quot;color&quot;: &quot;green&quot;},&#10;   {&quot;label&quot;: &quot;glycans&quot;, &quot;hetero&quot;: true, &quot;resn&quot;: [&quot;NAG&quot;], &quot;style&quot;: &quot;sticks&quot;, &quot;color&quot;: &quot;violet&quot;}],&#10; &quot;focus&quot;: &quot;RBD (chain A)&quot;,&#10; &quot;caption&quot;: &quot;In 6VXX all three receptor-binding domains (residues 319–541, coloured by protomer) are in the &#x27;down&#x27; conformation, packed together at the apex of the trimer; the grey remainder is the rest of the spike, with N-linked glycans shown as sticks.&quot;}&#10;"><img class="pmd-still" src="/assets/pm-chat-demo/data/cards/v0u4cp.webp" width="643" height="587" alt="3D structure: SARS-CoV-2 spike trimer, closed prefusion state (6VXX)" loading="lazy" decoding="async"/></div><!--/$--></div></div><div class="kc-answer-foot"><span class="kc-kicker">Cited</span><a class="kc-src-chip k-paper" href="https://doi.org/10.1038/s41586-024-07487-w" target="_blank" rel="noopener noreferrer" title="AlphaFold 3"><span>AlphaFold 3</span></a></div></div></div></div></section><section class="pmd-panel" data-i="3" aria-label="4 of 4: Extracting Training Data from Diffusion Models"><header class="kc-topbar"><div class="kc-title"><h1>Training-data extraction</h1></div><span class="kc-model-pill" title="Model that wrote this answer">Claude Code</span><span class="pmd-step"><label for="pmd-r2" class="pmd-arrow" title="Previous paper" aria-hidden="true">‹</label><span class="pmd-of">4<!-- --> / <!-- -->4</span><label for="pmd-r0" class="pmd-arrow" title="Next paper" aria-hidden="true">›</label></span></header><div class="kc-scroll"><div class="thread"><div class="pmd-paper"><span class="kc-kicker">In the library</span><h2><a href="https://arxiv.org/abs/2301.13188" target="_blank" rel="noopener noreferrer">Extracting Training Data from Diffusion Models</a></h2><div class="pmd-paper-meta">Carlini, Hayes, Nasr et al. · 2023 · USENIX Security</div><p>This paper demonstrates that state-of-the-art diffusion models, including Stable Diffusion and Imagen, memorize and regenerate specific individual training examples.</p></div><div class="msg user"><div class="bubble-row"><div class="user-text">How did this paper extract training images from Stable Diffusion, and how many did it find? Answer briefly and cite the paper.</div></div></div><div class="msg assistant"><div class="kc-section"><div class="kc-md"><p><a href="https://arxiv.org/abs/2301.13188" target="_blank" rel="noreferrer">Extracting Training Data from Diffusion Models</a> attacks Stable Diffusion v1.4 as a black box. The model is only queried, never inspected, and the pipeline has two stages: generate, then filter.</p>&#10;<ol>&#10;<li><strong>Picking prompts.</strong> Images that appear many times in training are the most likely to be memorized. The authors embedded the LAION training set with CLIP and looked for clusters of near-duplicates by cosine similarity. They then used the captions of the most-duplicated images as prompts (about 350k).</li>&#10;<li><strong>Generating candidates.</strong> They drew about 500 samples per prompt, roughly 175 million images in total.</li>&#10;<li><strong>Filtering for memorization.</strong> A memorized image tends to come back almost unchanged across different random seeds, while novel generations vary. So for each prompt they built a graph whose nodes are the generated images. Two images are joined by an edge if they are near-identical, measured by the largest <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi mathvariant="normal">ℓ</mi><mn>2</mn></msub></mrow><annotation encoding="application/x-tex">\ell_2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8444em;vertical-align:-0.15em"></span><span class="mord"><span class="mord">ℓ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em"><span></span></span></span></span></span></span></span></span></span> distance between any pair of corresponding <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>128</mn><mo>×</mo><mn>128</mn></mrow><annotation encoding="application/x-tex">128\times128</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em"></span><span class="mord">128</span><span class="mspace" style="margin-right:0.2222em"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em"></span></span><span class="base"><span class="strut" style="height:0.6444em"></span><span class="mord">128</span></span></span></span> tiles (16 tiles per image). Using tiles stops a shared background from making two images look like copies. Any clique of at least 10 mutually near-identical images is flagged as a likely memorized sample.</li>&#10;<li><strong>Checking against the training set.</strong> Each flagged image counts as extracted if it lies within normalized <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi mathvariant="normal">ℓ</mi><mn>2</mn></msub><mo>≤</mo><mn>0.15</mn></mrow><annotation encoding="application/x-tex">\ell_2 \le 0.15</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8444em;vertical-align:-0.15em"></span><span class="mord"><span class="mord">ℓ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em"></span><span class="mrel">≤</span><span class="mspace" style="margin-right:0.2778em"></span></span><span class="base"><span class="strut" style="height:0.6444em"></span><span class="mord">0.15</span></span></span></span> of an actual training image.</li>&#10;</ol>&#10;<p><strong>Result:</strong> 94 images met the <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><msub><mi mathvariant="normal">ℓ</mi><mn>2</mn></msub><mo separator="true">,</mo><mn>0.15</mn><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(\ell_2, 0.15)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em"></span><span class="mopen">(</span><span class="mord"><span class="mord">ℓ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em"><span></span></span></span></span></span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em"></span><span class="mord">0.15</span><span class="mclose">)</span></span></span></span> extraction criterion. Manual inspection found 13 more near-copies, for 109 in total out of about 175M generations. Many were within <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi mathvariant="normal">ℓ</mi><mn>2</mn></msub><mo>&lt;</mo><mn>0.05</mn></mrow><annotation encoding="application/x-tex">\ell_2 &lt; 0.05</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8444em;vertical-align:-0.15em"></span><span class="mord"><span class="mord">ℓ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em"></span><span class="mrel">&lt;</span><span class="mspace" style="margin-right:0.2778em"></span></span><span class="base"><span class="strut" style="height:0.6444em"></span><span class="mord">0.05</span></span></span></span>, which is about as close as a JPEG re-encoding of the same image. They included photos of identifiable people and trademarked logos.</p>&#10;<p>The paper&#x27;s headline figure of &quot;over a thousand&quot; extracted examples covers all the models it attacks, not just Stable Diffusion. The method also depends on knowing training captions, and it is costly: finding about a hundred memorized images took hundreds of millions of samples.</p></div></div><div class="kc-answer-foot"><span class="kc-kicker">Cited</span><a class="kc-src-chip k-paper" href="https://arxiv.org/abs/2301.13188" target="_blank" rel="noopener noreferrer" title="Extracting Training Data from Diffusion Models"><span>Extracting Training Data from Diffusion Models</span></a></div></div></div></div></section></main></div></div></template>{% endraw %}
