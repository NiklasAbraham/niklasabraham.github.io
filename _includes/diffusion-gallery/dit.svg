t class="bs dw" x="76.0" y="399.8" text-anchor="middle">γ₁ β₁ α₁ γ₂ β₂ α₂</text></g><path class="ln w" d="M76.0,432.0 L76.0,410.0" marker-end="url(#dit-aw)"/><path class="ln w dsh" d="M138.0,388.0 L160.0,388.0"/><path class="ln w dsh" d="M160.0,284.0 L160.0,501.0"/><text class="lab w" x="76.0" y="304.0" text-anchor="middle">adaLN-Zero</text><text class="lab" x="76.0" y="320.0" text-anchor="middle">α = 0 at init:</text><text class="lab" x="76.0" y="334.0" text-anchor="middle">every block starts</text><text class="lab" x="76.0" y="348.0" text-anchor="middle">as the identity</text></svg>
