<svg class="dg-svg" viewBox="0 110 520 530" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dit-title"><title id="dit-title">dit architecture</title><defs><marker id="dit-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ah" d="M0,1 L9,5 L0,9 z"/></marker><marker id="dit-aw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ah w" d="M0,1 L9,5 L0,9 z"/></marker></defs><g class="blk" data-k="noisy-latent-z-t"><rect class="bx io" x="190.0" y="594.0" width="210.0" height="34.0" rx="7"/><text class="bt" x="295.0" y="608.8" text-anchor="middle">noisy latent z<tspan class="sc" baseline-shift="-22%">t</tspan></text><text class="bs" x="295.0" y="622.8" text-anchor="middle">4 × 32 × 32 (256² image)</text></g><path class="ln f" d="M295.0,594.0 L295.0,576.0" marker-end="url(#dit-a)"/><g class="blk" data-k="patchify-p-2"><rect class="bx embed diff" x="190.0" y="536.0" width="210.0" height="40.0" rx="7"/><text class="bt" x="295.0" y="553.8" text-anchor="middle">patchify, p = 2</text><text class="bs dw" x="295.0" y="567.8" text-anchor="middle">→ 256 tokens · + sin-cos pos.</text></g><circle class="dot f" cx="295.0" cy="522.0" r="2.6"/><path class="ln f" d="M295.0,522.0 L295.0,512.0" marker-end="url(#dit-a)"/><g class="blk" data-k="layernorm"><rect class="bx norm" x="227.8" y="490.0" width="134.4" height="22.0" rx="7"/><text class="bt sm" x="295.0" y="504.0" text-anchor="middle">LayerNorm · γ, β</text></g><path class="ln w dsh" d="M160.0,501.0 L227.8,501.0" marker-end="url(#dit-aw)"/><path class="ln f" d="M295.0,490.0 L295.0,480.0" marker-end="url(#dit-a)"/><g class="blk" data-k="multi-head-self-attention"><rect class="bx attn" x="190.0" y="442.0" width="210.0" height="38.0" rx="7"/><text class="bt" x="295.0" y="458.8" text-anchor="middle">multi-head self-attention</text><text class="bs" x="295.0" y="472.8" text-anchor="middle">16 heads · d = 1152</text></g><path class="ln f" d="M295.0,442.0 L295.0,434.0" marker-end="url(#dit-a)"/><g class="blk" data-k="scale"><rect class="bx norm" x="253.0" y="416.0" width="84.0" height="18.0" rx="7"/><text class="bt sm" x="295.0" y="428.0" text-anchor="middle">scale α</text></g><path class="ln w dsh" d="M160.0,425.0 L253.0,425.0" marker-end="url(#dit-aw)"/><path class="ln f" d="M295.0,416.0 L295.0,404.0" marker-end="url(#dit-a)"/><g class="plus"><circle cx="295.0" cy="396.5" r="7.5"/><path d="M290.9,396.5 H299.1 M295.0,392.4 V400.6"/></g><path class="ln r" d="M295.0,522.0 L414.0,522.0 L414.0,396.5 L302.5,396.5" marker-end="url(#dit-a)"/><circle class="dot f" cx="295.0" cy="381.0" r="2.6"/><path class="ln f" d="M295.0,381.0 L295.0,371.0" marker-end="url(#dit-a)"/><g class="blk" data-k="layernorm"><rect class="bx norm" x="227.8" y="349.0" width="134.4" height="22.0" rx="7"/><text class="bt sm" x="295.0" y="363.0" text-anchor="middle">LayerNorm · γ, β</text></g><path class="ln w dsh" d="M160.0,360.0 L227.8,360.0" marker-end="url(#dit-aw)"/><path class="ln f" d="M295.0,349.0 L295.0,339.0" marker-end="url(#dit-a)"/><g class="blk" data-k="pointwise-mlp"><rect class="bx mlp" x="190.0" y="301.0" width="210.0" height="38.0" rx="7"/><text class="bt" x="295.0" y="317.8" text-anchor="middle">pointwise MLP</text><text class="bs" x="295.0" y="331.8" text-anchor="middle">1152 → 4608 → 1152</text></g><path class="ln f" d="M295.0,301.0 L295.0,293.0" marker-end="url(#dit-a)"/><g class="blk" data-k="scale"><rect class="bx norm" x="253.0" y="275.0" width="84.0" height="18.0" rx="7"/><text class="bt sm" x="295.0" y="287.0" text-anchor="middle">scale α</text></g><path class="ln w dsh" d="M160.0,284.0 L253.0,284.0" marker-end="url(#dit-aw)"/><path class="ln f" d="M295.0,275.0 L295.0,263.0" marker-end="url(#dit-a)"/><g class="plus"><circle cx="295.0" cy="255.5" r="7.5"/><path d="M290.9,255.5 H299.1 M295.0,251.4 V259.6"/></g><path class="ln r" d="M295.0,381.0 L414.0,381.0 L414.0,2