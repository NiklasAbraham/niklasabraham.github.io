<svg class="dg-svg" viewBox="0 467 520 533" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rfd3-title"><title id="rfd3-title">rfd3 architecture</title><defs><marker id="rfd3-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ah" d="M0,1 L9,5 L0,9 z"/></marker><marker id="rfd3-aw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ah w" d="M0,1 L9,5 L0,9 z"/></marker></defs><g class="blk" data-k="input"><rect class="bx io diff" x="34.0" y="950.0" width="196.0" height="38.0" rx="7"/><text class="bt" x="132.0" y="966.8" text-anchor="middle">design conditions</text><text class="bs dw" x="132.0" y="980.8" text-anchor="middle">motif atoms · ligands · symmetry</text></g><path class="ln f" d="M132.0,950.0 L132.0,936.0" marker-end="url(#rfd3-a)"/><g class="blk" data-k="atomise"><rect class="bx embed diff" x="34.0" y="896.0" width="196.0" height="40.0" rx="7"/><text class="bt" x="132.0" y="913.8" text-anchor="middle">atomisation</text><text class="bs dw" x="132.0" y="927.8" text-anchor="middle">4 + 10 atoms per residue</text></g><path class="ln f" d="M132.0,896.0 L132.0,882.0" marker-end="url(#rfd3-a)"/><g class="blk" data-k="emb"><rect class="bx embed" x="34.0" y="842.0" width="196.0" height="40.0" rx="7"/><text class="bt" x="132.0" y="859.8" text-anchor="middle">input embedder</text><text class="bs" x="132.0" y="873.8" text-anchor="middle">atoms → tokens</text></g><path class="ln f" d="M132.0,842.0 L132.0,816.0" marker-end="url(#rfd3-a)"/><g class="blk" data-k="pf"><rect class="bx pair diff" x="50.0" y="770.0" width="180.0" height="46.0" rx="7"/><text class="bt" x="140.0" y="790.8" text-anchor="middle">Pairformer</text><text class="bs dw" x="140.0" y="804.8" text-anchor="middle">2 layers · no triangle updates</text></g><rect class="grp" x="24.0" y="736.0" width="216.0" height="96.0" rx="11"/><text class="gl" x="34.0" y="760.0" text-anchor="start">conditioning trunk · once per target</text><path class="ln f" d="M196.0,770.0 L196.0,711.0" marker-end="url(#rfd3-a)"/><g class="blk" data-k="c"><rect class="pl ink" x="152.8" y="695.0" width="86.3" height="16" rx="8"/><text class="pl-t ink-t" x="196.0" y="706.5" text-anchor="middle">c = (s<tspan class="sc" baseline-shift="-22%">i</tspan>, z<tspan class="sc" baseline-shift="-22%">ij</tspan>)</text></g><g class="blk" data-k="noise"><rect class="bx io" x="282.0" y="950.0" width="196.0" height="38.0" rx="7"/><text class="bt" x="380.0" y="966.8" text-anchor="middle">noise at σ<tspan class="sc" baseline-shift="-22%">max</tspan></text><text class="bs" x="380.0" y="980.8" text-anchor="middle">atom coordinates x</text></g><path class="ln f" d="M380.0,950.0 L380.0,924.0" marker-end="url(#rfd3-a)"/><g class="blk" data-k="cond"><rect class="bx cond diff" x="292.0" y="876.0" width="176.0" height="48.0" rx="7"/><text class="bt" x="380.0" y="891.5" text-anchor="middle">conditioning</text><text class="bs dw" x="380.0" y="905.5" text-anchor="middle">motif atoms sit in the noise cloud</text><text class="bs dw" x="380.0" y="918.0" text-anchor="middle">s ⊕ Fourier(σ) · CFG γ<tspan class="sc" baseline-shift="-22%">CFG</tspan></text></g><path class="ln f" d="M380.0,876.0 L380.0,864.0" marker-end="url(#rfd3-a)"/><g class="blk" data-k="aenc"><rect class="bx attn diff" x="292.0" y="816.0" width="176.0" height="48.0" rx="7"/><text class="bt" x="380.0" y="831.5" text-anchor="middle">downsample · atom encoder</text><text class="bs dw" x="380.0" y="845.5" text-anchor="middle">sparse: geometric neighbours</text><text class="bs dw" x="380.0" y="858.0" text-anchor="middle">cross-attention atoms → tokens</text></g><path class="ln f" d="M380.0,816.0 L380.0,804.0" marker-end="url(#rfd3-a)"/><g class="blk" data-k="tok"><rect class="bx attn diff" x="292.0" y="764.0" width="176.0" height="40.0" rx="7"/><text class="bt" x="380.0" y="781.8" text-anchor="middle">token transformer</text><text class="bs dw" x="380.0" y="795.8" text-anchor="middle">sparse attention over tokens</text></g><path class="ln f" d="M380.0,764.0 L380.0,752.0" marker-end="url(#rfd3-a)"/><g class="blk" data-k="adec"><rect class="bx attn" x="292.0" y="704.0" width="176.0" height="48.0" rx="7"/><text class="bt" x="380.0" y="719.5" text-anchor="middle">upsample · atom decoder</text><text class="bs" x="380.0" y="733.5" text-anchor="middle">tokens modulate atoms</text><text class="bs" x="380.0" y="746.0" text-anchor="middle">→ coordinate update</text></g><rect class="grp" x="272.0" y="670.0" width="216.0" height="270.0" rx="11"/><text class="gl" x="282.0" y="694.0" text-anchor="start">denoiser D<tspan class="sc" baseline-shift="-22%">θ</tspan>(x, σ | c)</text><rect class="rep" x="282.0" y="661.0" width="133.6" height="18" rx="9"/><text class="rep-t" x="348.8" y="674.0" text-anchor="middle">× 100 steps · 168 M</text><path class="ln w dsh" d="M484.0,694.0 C504.0,710.0 504.0,906.0 476.0,926.0" marker-end="url(#rfd3-aw)"/><text class="lab w vert" x="508.0" y="803.0" text-anchor="middle">x̂ → next x · step scale · recycled every step</text><path class="ln w" d="M239.2,703.0 L252.0,703.0 L252.0,900.0 L292.0,900.0" marker-end="url(#rfd3-aw)"/><path class="ln w dsh" d="M468.0,900.0 L480.0,900.0 L480.0,784.0 L468.0,784.0" marker-end="url(#rfd3-aw)"/><path class="ln f" d="M444.0,704.0 L444.0,605.0" marker-end="url(#rfd3-a)"/><g class="blk" data-k="xhat"><rect class="bx io" x="282.0" y="569.0" width="196.0" height="36.0" rx="7"/><text class="bt" x="380.0" y="584.8" text-anchor="middle">designed structure x̂</text><text class="bs" x="380.0" y="598.8" text-anchor="middle">all atoms, backbone + sidechain</text></g><g class="blk" data-k="out"><rect class="bx io" x="150.0" y="479.0" width="220.0" height="40.0" rx="7"/><text class="bt" x="260.0" y="496.8" text-anchor="middle">protein, RNA or DNA design</text><text class="bs" x="260.0" y="510.8" text-anchor="middle">sequence from MPNN, or codesigned</text></g><path class="ln f" d="M380.0,569.0 L380.0,499.0 L370.0,499.0" marker-end="url(#rfd3-a)"/><rect class="grp" x="24.0" y="535.0" width="216.0" height="147.0" rx="11"/><text class="gl" x="34.0" y="550.0" text-anchor="start">what AF3 has here</text><text class="lab" x="132.0" y="590.5" text-anchor="middle">MSA module</text><text class="lab" x="132.0" y="608.5" text-anchor="middle">template module</text><text class="lab" x="132.0" y="626.5" text-anchor="middle">confidence head</text><text class="lab w vert halo" x="263.0" y="791.0" text-anchor="middle">c from 2 layers, not 48</text></svg>
