<svg class="dg-svg" viewBox="0 502 520 398" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rfdiffusion-title"><title id="rfdiffusion-title">rfdiffusion architecture</title><defs><marker id="rfdiffusion-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ah" d="M0,1 L9,5 L0,9 z"/></marker><marker id="rfdiffusion-aw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ah w" d="M0,1 L9,5 L0,9 z"/></marker></defs><g class="blk" data-k="noised-residue-frames-x-t"><rect class="bx io" x="150.0" y="850.0" width="220.0" height="38.0" rx="7"/><text class="bt" x="260.0" y="866.8" text-anchor="middle">noised residue frames x<tspan class="sc" baseline-shift="-22%">t</tspan></text><text class="bs" x="260.0" y="880.8" text-anchor="middle">Cα: Gaussian · rotation: IGSO(3)</text></g><g class="blk" data-k="motif-hotspots"><rect class="bx cond" x="390.0" y="850.0" width="116.0" height="38.0" rx="7"/><text class="bt" x="448.0" y="866.8" text-anchor="middle">motif · hotspots</text><text class="bs" x="448.0" y="880.8" text-anchor="middle">symmetry</text></g><g class="blk" data-k="previous-x"><rect class="bx cond dash" x="14.0" y="850.0" width="120.0" height="38.0" rx="7"/><text class="bt" x="74.0" y="866.8" text-anchor="middle">previous x̂₀</text><text class="bs" x="74.0" y="880.8" text-anchor="middle">self-conditioning</text></g><path class="ln f" d="M260.0,850.0 L260.0,814.0" marker-end="url(#rfdiffusion-a)"/><path class="ln w" d="M448.0,850.0 L448.0,814.0" marker-end="url(#rfdiffusion-aw)"/><path class="ln w dsh" d="M74.0,850.0 L74.0,814.0" marker-end="url(#rfdiffusion-aw)"/><g class="blk" data-k="msa-attention"><rect class="bx embed" x="58.0" y="774.0" width="120.0" height="28.0" rx="7"/><text class="bt sm" x="118.0" y="791.0" text-anchor="middle">MSA attention</text></g><path class="ln f" d="M118.0,774.0 L118.0,762.0" marker-end="url(#rfdiffusion-a)"/><g class="blk" data-k="transition"><rect class="bx embed" x="58.0" y="734.0" width="120.0" height="28.0" rx="7"/><text class="bt sm" x="118.0" y="751.0" text-anchor="middle">transition</text></g><text class="bt" x="118.0" y="710.0" text-anchor="middle">1D track</text><text class="bs" x="118.0" y="724.0" text-anchor="middle">per residue · 256 ch</text><g class="blk" data-k="pair-update"><rect class="bx pair" x="200.0" y="774.0" width="120.0" height="28.0" rx="7"/><text class="bt sm" x="260.0" y="791.0" text-anchor="middle">pair update</text></g><path class="ln f" d="M260.0,774.0 L260.0,762.0" marker-end="url(#rfdiffusion-a)"/><g class="blk" data-k="biaxial-attention"><rect class="bx pair" x="200.0" y="734.0" width="120.0" height="28.0" rx="7"/><text class="bt sm" x="260.0" y="751.0" text-anchor="middle">biaxial attention</text></g><text class="bt" x="260.0" y="710.0" text-anchor="middle">2D track</text><text class="bs" x="260.0" y="724.0" text-anchor="middle">residue pairs · 128 ch</text><g class="blk" data-k="se-3-transformer"><rect class="bx attn" x="342.0" y="774.0" width="120.0" height="28.0" rx="7"/><text class="bt sm" x="402.0" y="791.0" text-anchor="middle">SE(3)-transformer</text></g><path class="ln f" d="M402.0,774.0 L402.0,762.0" marker-end="url(#rfdiffusion-a)"/><g class="blk" data-k="frame-update"><rect class="bx attn" x="342.0" y="734.0" width="120.0" height="28.0" rx="7"/><text class="bt sm" x="402.0" y="751.0" text-anchor="middle">frame update</text></g><text class="bt" x="402.0" y="710.0" text-anchor="middle">3D track</text><text class="bs" x="402.0" y="724.0" text-anchor="middle">frames, kNN graph</text><path class="ln f" d="M178.0,788.0 L200.0,788.0" marker-end="url(#rfdiffusion-a)"/><path class="ln f" d="M200.0,748.0 L178.0,748.0" marker-end="url(#rfdiffusion-a)"/><path class="ln f" d="M320.0,788.0 L342.0,788.0" marker-end="url(#rfdiffusion-a)"/><path class="ln f" d="M342.0,748.0 L320.0,748.0" marker-end="url(#rfdiffusion-a)"/><rect class="grp" x="42.0" y="668.0" width="436.0" height="146.0" rx="11"/><text class="gl" x="52.0" y="683.0" text-anchor="start">three-track block</text><rect class="rep" x="432.4" y="659.0" width="37.6" height="18" rx="9"/><text class="rep-t" x="451.2" y="672.0" text-anchor="middle">× 36</text><path class="ln f" d="M260.0,668.0 L260.0,652.0" marker-end="url(#rfdiffusion-a)"/><g class="blk" data-k="structure-refinement"><rect class="bx attn" x="58.0" y="614.0" width="404.0" height="38.0" rx="7"/><text class="bt" x="260.0" y="630.8" text-anchor="middle">structure refinement</text><text class="bs" x="260.0" y="644.8" text-anchor="middle">4 SE(3)-transformer blocks</text></g><rect class="grp" x="24.0" y="574.0" width="464.0" height="254.0" rx="11"/><text class="gl" x="34.0" y="598.0" text-anchor="start">denoiser · RoseTTAFold, fine-tuned</text><rect class="rep" x="34.0" y="565.0" width="101.6" height="18" rx="9"/><text class="rep-t" x="84.8" y="578.0" text-anchor="middle">× 50–200 steps</text><path class="ln w dsh" d="M492,598.0 C510,614.0 510,798.0 484,820.0" marker-end="url(#rfdiffusion-aw)"/><text class="lab w vert" x="514.0" y="701.0" text-anchor="middle">x̂₀ → next x<tspan class="sc" baseline-shift="-22%">t</tspan>: a step toward x̂₀</text><path class="ln f" d="M260.0,614.0 L260.0,552.0" marker-end="url(#rfdiffusion-a)"/><g class="blk" data-k="predicted-x"><rect class="bx io" x="150.0" y="514.0" width="220.0" height="38.0" rx="7"/><text class="bt" x="260.0" y="530.8" text-anchor="middle">predicted x̂₀</text><text class="bs" x="260.0" y="544.8" text-anchor="middle">clean frames, not ε</text></g><path class="ln w dsh" d="M150,533.0 H38 Q12,533.0 12,559.0 V826.0 Q12,840.0 30,847.0" marker-end="url(#rfdiffusion-aw)"/></svg>
