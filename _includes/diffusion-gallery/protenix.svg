<svg class="dg-svg" viewBox="0 439 520 561" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="protenix-title"><title id="protenix-title">protenix architecture</title><defs><marker id="protenix-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ah" d="M0,1 L9,5 L0,9 z"/></marker><marker id="protenix-aw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ah w" d="M0,1 L9,5 L0,9 z"/></marker></defs><g class="blk" data-k="input"><rect class="bx io" x="34.0" y="950.0" width="196.0" height="38.0" rx="7"/><text class="bt" x="132.0" y="973.0" text-anchor="middle">sequences + ligand SMILES</text></g><path class="ln f" d="M132.0,950.0 L132.0,936.0" marker-end="url(#protenix-a)"/><g class="blk" data-k="emb"><rect class="bx embed" x="34.0" y="896.0" width="196.0" height="40.0" rx="7"/><text class="bt" x="132.0" y="913.8" text-anchor="middle">input embedder</text><text class="bs" x="132.0" y="927.8" text-anchor="middle">atoms → tokens · 3 blocks</text></g><path class="ln f" d="M132.0,896.0 L132.0,870.0" marker-end="url(#protenix-a)"/><g class="blk" data-k="tmpl"><rect class="bx pair" x="50.0" y="824.0" width="180.0" height="46.0" rx="7"/><text class="bt" x="140.0" y="844.8" text-anchor="middle">template module</text><text class="bs" x="140.0" y="858.8" text-anchor="middle">2 blocks</text></g><path class="ln f" d="M140.0,824.0 L140.0,812.0" marker-end="url(#protenix-a)"/><g class="blk" data-k="msa"><rect class="bx pair" x="50.0" y="766.0" width="180.0" height="46.0" rx="7"/><text class="bt" x="140.0" y="786.8" text-anchor="middle">MSA module</text><text class="bs" x="140.0" y="800.8" text-anchor="middle">4 blocks · 3 M</text></g><path class="ln f" d="M140.0,766.0 L140.0,754.0" marker-end="url(#protenix-a)"/><g class="blk" data-k="pf"><rect class="bx pair" x="50.0" y="708.0" width="180.0" height="46.0" rx="7"/><text class="bt" x="140.0" y="728.8" text-anchor="middle">Pairformer</text><text class="bs" x="140.0" y="742.8" text-anchor="middle">48 blocks · 147 M</text></g><rect class="grp" x="24.0" y="674.0" width="216.0" height="212.0" rx="11"/><text class="gl" x="34.0" y="698.0" text-anchor="start">trunk · once per target</text><rect class="rep ink" x="34.0" y="665.0" width="82.4" height="18" rx="9"/><text class="rep-t ink-t" x="75.2" y="678.0" text-anchor="middle">× 10 passes</text><path class="ln f dsh" d="M38.0,714.0 C4.0,730.0 4.0,842.0 48.0,858.0" marker-end="url(#protenix-a)"/><path class="ln f" d="M196.0,708.0 L196.0,649.0" marker-end="url(#protenix-a)"/><g class="blk" data-k="c"><rect class="pl ink" x="152.8" y="633.0" width="86.3" height="16" rx="8"/><text class="pl-t ink-t" x="196.0" y="644.5" text-anchor="middle">c = (s<tspan class="sc" baseline-shift="-22%">i</tspan>, z<tspan class="sc" baseline-shift="-22%">ij</tspan>)</text></g><g class="blk" data-k="noise"><rect class="bx io" x="282.0" y="950.0" width="196.0" height="38.0" rx="7"/><text class="bt" x="380.0" y="966.8" text-anchor="middle">noise at σ<tspan class="sc" baseline-shift="-22%">max</tspan></text><text class="bs" x="380.0" y="980.8" text-anchor="middle">atom coordinates x</text></g><path class="ln f" d="M380.0,950.0 L380.0,924.0" marker-end="url(#protenix-a)"/><g class="blk" data-k="cond"><rect class="bx cond diff" x="292.0" y="876.0" width="176.0" height="48.0" rx="7"/><text class="bt" x="380.0" y="891.5" text-anchor="middle">conditioning</text><text class="bs dw" x="380.0" y="905.5" text-anchor="middle">pair + atom terms cached</text><text class="bs dw" x="380.0" y="918.0" text-anchor="middle">across steps</text></g><path class="ln f" d="M380.0,876.0 L380.0,864.0" marker-end="url(#protenix-a)"/><g class="blk" data-k="aenc"><rect class="bx attn" x="292.0" y="824.0" width="176.0" height="40.0" rx="7"/><text class="bt" x="380.0" y="841.8" text-anchor="middle">atom encoder</text><text class="bs" x="380.0" y="855.8" text-anchor="middle">3 blocks · as AF3</text></g><path class="ln f" d="M380.0,824.0 L380.0,812.0" marker-end="url(#protenix-a)"/><g class="blk" data-k="tok"><rect class="bx attn diff" x="292.0" y="764.0" width="176.0" height="48.0" rx="7"/><text class="bt" x="380.0" y="779.5" text-anchor="middle">token transformer</text><text class="bs dw" x="380.0" y="793.5" text-anchor="middle">24 × 16 heads · 768 · 198 M</text><text class="bs dw" x="380.0" y="806.0" text-anchor="middle">residual added</text></g><path class="ln f" d="M380.0,764.0 L380.0,752.0" marker-end="url(#protenix-a)"/><g class="blk" data-k="adec"><rect class="bx attn" x="292.0" y="712.0" width="176.0" height="40.0" rx="7"/><text class="bt" x="380.0" y="729.8" text-anchor="middle">atom decoder</text><text class="bs" x="380.0" y="743.8" text-anchor="middle">3 blocks</text></g><rect class="grp" x="272.0" y="678.0" width="216.0" height="262.0" rx="11"/><text class="gl" x="282.0" y="702.0" text-anchor="start">denoiser D<tspan class="sc" baseline-shift="-22%">θ</tspan>(x, σ | c)</text><rect class="rep" x="282.0" y="669.0" width="133.6" height="18" rx="9"/><text class="rep-t" x="348.8" y="682.0" text-anchor="middle">× 200 steps · 203 M</text><path class="ln w dsh" d="M484.0,702.0 C504.0,718.0 504.0,906.0 476.0,926.0" marker-end="url(#protenix-aw)"/><text class="lab w vert" x="508.0" y="807.0" text-anchor="middle">x̂ → next x, σ shrinks</text><path class="ln w" d="M239.2,641.0 L252.0,641.0 L252.0,900.0 L292.0,900.0" marker-end="url(#protenix-aw)"/><path class="ln w dsh" d="M468.0,900.0 L480.0,900.0 L480.0,788.0 L468.0,788.0" marker-end="url(#protenix-aw)"/><path class="ln f" d="M444.0,712.0 L444.0,577.0" marker-end="url(#protenix-a)"/><g class="blk" data-k="xhat"><rect class="bx io" x="282.0" y="541.0" width="196.0" height="36.0" rx="7"/><text class="bt" x="380.0" y="556.8" text-anchor="middle">structure x̂</text><text class="bs" x="380.0" y="570.8" text-anchor="middle">S samples</text></g><g class="blk" data-k="conf"><rect class="bx pair" x="34.0" y="533.0" width="196.0" height="52.0" rx="7"/><text class="bt" x="132.0" y="556.8" text-anchor="middle">confidence head</text><text class="bs" x="132.0" y="570.8" text-anchor="middle">Pairformer 4 blocks · 13 M</text></g><path class="ln f" d="M196.0,633.0 L196.0,585.0" marker-end="url(#protenix-a)"/><path class="ln f" d="M282.0,559.0 L230.0,559.0" marker-end="url(#protenix-a)"/><g class="blk" data-k="out"><rect class="bx io" x="150.0" y="451.0" width="220.0" height="40.0" rx="7"/><text class="bt" x="260.0" y="468.8" text-anchor="middle">S structures + confidence</text><text class="bs" x="260.0" y="482.8" text-anchor="middle">pLDDT · PAE · pTM</text></g><path class="ln f" d="M132.0,533.0 L132.0,471.0 L150.0,471.0" marker-end="url(#protenix-a)"/><path class="ln f" d="M380.0,541.0 L380.0,471.0 L370.0,471.0" marker-end="url(#protenix-a)"/><text class="lab vert halo" x="11.0" y="786.0" text-anchor="middle">recycle</text><text class="lab w vert halo" x="263.0" y="760.0" text-anchor="middle">c, pair terms cached once</text></svg>
