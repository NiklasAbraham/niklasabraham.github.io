<svg class="dg-svg" viewBox="0 467 520 533" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="esmfold2-title"><title id="esmfold2-title">esmfold2 architecture</title><defs><marker id="esmfold2-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ah" d="M0,1 L9,5 L0,9 z"/></marker><marker id="esmfold2-aw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ah w" d="M0,1 L9,5 L0,9 z"/></marker></defs><g class="blk" data-k="input"><rect class="bx io" x="34.0" y="950.0" width="196.0" height="38.0" rx="7"/><text class="bt" x="132.0" y="973.0" text-anchor="middle">sequences + ligand SMILES</text></g><path class="ln f" d="M132.0,950.0 L132.0,936.0" marker-end="url(#esmfold2-a)"/><g class="blk" data-k="lm"><rect class="bx cond diff" x="34.0" y="896.0" width="196.0" height="40.0" rx="7"/><text class="bt" x="132.0" y="913.8" text-anchor="middle">ESM C protein LM</text><text class="bs dw" x="132.0" y="927.8" text-anchor="middle">6 B parameters, frozen</text></g><path class="ln f" d="M132.0,896.0 L132.0,870.0" marker-end="url(#esmfold2-a)"/><g class="blk" data-k="msa"><rect class="bx pair diff dash" x="50.0" y="824.0" width="180.0" height="46.0" rx="7"/><text class="bt" x="140.0" y="844.8" text-anchor="middle">MSA module</text><text class="bs dw" x="140.0" y="858.8" text-anchor="middle">optional · 4 layers</text></g><path class="ln f" d="M140.0,824.0 L140.0,812.0" marker-end="url(#esmfold2-a)"/><g class="blk" data-k="pair"><rect class="bx pair diff" x="50.0" y="766.0" width="180.0" height="46.0" rx="7"/><text class="bt" x="140.0" y="780.5" text-anchor="middle">pair stack</text><text class="bs dw" x="140.0" y="794.5" text-anchor="middle">48 layers · 256-ch z</text><text class="bs dw" x="140.0" y="807.0" text-anchor="middle">no single track</text></g><rect class="grp" x="24.0" y="732.0" width="216.0" height="154.0" rx="11"/><text class="gl" x="34.0" y="756.0" text-anchor="start">trunk · once per target</text><rect class="rep ink" x="34.0" y="723.0" width="76.0" height="18" rx="9"/><text class="rep-t ink-t" x="72.0" y="736.0" text-anchor="middle">× 10 loops</text><path class="ln f dsh" d="M38.0,772.0 C4.0,788.0 4.0,842.0 48.0,858.0" marker-end="url(#esmfold2-a)"/><path class="ln f" d="M196.0,766.0 L196.0,707.0" marker-end="url(#esmfold2-a)"/><g class="blk" data-k="c"><rect class="pl ink" x="127.2" y="691.0" width="116.8" height="16" rx="8"/><text class="pl-t ink-t" x="185.6" y="702.5" text-anchor="middle">c = (s<tspan class="sc" baseline-shift="38%">inputs</tspan>, z<tspan class="sc" baseline-shift="-22%">ij</tspan>)</text></g><g class="blk" data-k="noise"><rect class="bx io" x="282.0" y="950.0" width="196.0" height="38.0" rx="7"/><text class="bt" x="380.0" y="966.8" text-anchor="middle">noise at σ<tspan class="sc" baseline-shift="-22%">max</tspan></text><text class="bs" x="380.0" y="980.8" text-anchor="middle">atom coordinates x</text></g><path class="ln f" d="M380.0,950.0 L380.0,924.0" marker-end="url(#esmfold2-a)"/><g class="blk" data-k="cond"><rect class="bx cond diff" x="292.0" y="876.0" width="176.0" height="48.0" rx="7"/><text class="bt" x="380.0" y="891.5" text-anchor="middle">conditioning</text><text class="bs dw" x="380.0" y="905.5" text-anchor="middle">s<tspan class="sc" baseline-shift="38%">inputs</tspan> ⊕ Fourier(σ) → 768</text><text class="bs dw" x="380.0" y="918.0" text-anchor="middle">z cached across steps</text></g><path class="ln f" d="M380.0,876.0 L380.0,864.0" marker-end="url(#esmfold2-a)"/><g class="blk" data-k="aenc"><rect class="bx attn diff" x="292.0" y="816.0" width="176.0" height="48.0" rx="7"/><text class="bt" x="380.0" y="831.5" text-anchor="middle">atom encoder</text><text class="bs dw" x="380.0" y="845.5" text-anchor="middle">sliding window 128 · Flash</text><text class="bs dw" x="380.0" y="858.0" text-anchor="middle">3D RoPE from ref. conformer</text></g><path class="ln f" d="M380.0,816.0 L380.0,804.0" marker-end="url(#esmfold2-a)"/><g class="blk" data-k="tok"><rect class="bx attn diff" x="292.0" y="756.0" width="176.0" height="48.0" rx="7"/><text class="bt" x="380.0" y="771.5" text-anchor="middle">token transformer</text><text class="bs dw" x="380.0" y="785.5" text-anchor="middle">12 blocks × 16 heads · 768</text><text class="bs dw" x="380.0" y="798.0" text-anchor="middle">120 M · residual</text></g><path class="ln f" d="M380.0,756.0 L380.0,744.0" marker-end="url(#esmfold2-a)"/><g class="blk" data-k="adec"><rect class="bx attn" x="292.0" y="704.0" width="176.0" height="40.0" rx="7"/><text class="bt" x="380.0" y="721.8" text-anchor="middle">atom decoder</text><text class="bs" x="380.0" y="735.8" text-anchor="middle">3 blocks · RoPE</text></g><rect class="grp" x="272.0" y="670.0" width="216.0" height="270.0" rx="11"/><text class="gl" x="282.0" y="694.0" text-anchor="start">denoiser D<tspan class="sc" baseline-shift="-22%">θ</tspan>(x, σ | c)</text><rect class="rep" x="282.0" y="661.0" width="146.4" height="18" rx="9"/><text class="rep-t" x="355.2" y="674.0" text-anchor="middle">× 10–68 steps · 131 M</text><path class="ln w dsh" d="M484.0,694.0 C504.0,710.0 504.0,906.0 476.0,926.0" marker-end="url(#esmfold2-aw)"/><text class="lab w vert" x="508.0" y="803.0" text-anchor="middle">x̂ → next x · Kabsch · from σ = 256 Å</text><path class="ln w" d="M244.0,699.0 L252.0,699.0 L252.0,900.0 L292.0,900.0" marker-end="url(#esmfold2-aw)"/><path class="ln w dsh" d="M468.0,900.0 L480.0,900.0 L480.0,780.0 L468.0,780.0" marker-end="url(#esmfold2-aw)"/><path class="ln f" d="M444.0,704.0 L444.0,605.0" marker-end="url(#esmfold2-a)"/><g class="blk" data-k="xhat"><rect class="bx io" x="282.0" y="569.0" width="196.0" height="36.0" rx="7"/><text class="bt" x="380.0" y="584.8" text-anchor="middle">structure x̂</text><text class="bs" x="380.0" y="598.8" text-anchor="middle">S samples</text></g><g class="blk" data-k="conf"><rect class="bx pair diff" x="34.0" y="561.0" width="196.0" height="52.0" rx="7"/><text class="bt" x="132.0" y="584.8" text-anchor="middle">confidence head</text><text class="bs dw" x="132.0" y="598.8" text-anchor="middle">4 pair folding layers</text></g><path class="ln f" d="M196.0,691.0 L196.0,613.0" marker-end="url(#esmfold2-a)"/><path class="ln f" d="M282.0,587.0 L230.0,587.0" marker-end="url(#esmfold2-a)"/><g class="blk" data-k="out"><rect class="bx io" x="150.0" y="479.0" width="220.0" height="40.0" rx="7"/><text class="bt" x="260.0" y="496.8" text-anchor="middle">S structures + confidence</text><text class="bs" x="260.0" y="510.8" text-anchor="middle">pLDDT · PAE · pTM</text></g><path class="ln f" d="M132.0,561.0 L132.0,499.0 L150.0,499.0" marker-end="url(#esmfold2-a)"/><path class="ln f" d="M380.0,569.0 L380.0,499.0 L370.0,499.0" marker-end="url(#esmfold2-a)"/><text class="lab vert halo" x="11.0" y="815.0" text-anchor="middle">contractive loop</text><text class="lab w vert halo" x="263.0" y="789.0" text-anchor="middle">c: no trunk single, only z</text></svg>
