<svg class="dg-svg" viewBox="0 355 520 645" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bioemu2-title"><title id="bioemu2-title">bioemu2 architecture</title><defs><marker id="bioemu2-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ah" d="M0,1 L9,5 L0,9 z"/></marker><marker id="bioemu2-aw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ah w" d="M0,1 L9,5 L0,9 z"/></marker></defs><g class="blk" data-k="input"><rect class="bx io diff" x="34.0" y="950.0" width="196.0" height="38.0" rx="7"/><text class="bt" x="132.0" y="966.8" text-anchor="middle">sequences + ligands</text><text class="bs dw" x="132.0" y="980.8" text-anchor="middle">MSA · start frame for propagation</text></g><path class="ln f" d="M132.0,950.0 L132.0,936.0" marker-end="url(#bioemu2-a)"/><g class="blk" data-k="emb"><rect class="bx embed" x="34.0" y="896.0" width="196.0" height="40.0" rx="7"/><text class="bt" x="132.0" y="913.8" text-anchor="middle">input embedder</text><text class="bs" x="132.0" y="927.8" text-anchor="middle">atoms → tokens · 3 blocks</text></g><path class="ln f" d="M132.0,896.0 L132.0,882.0" marker-end="url(#bioemu2-a)"/><g class="blk" data-k="mode"><rect class="bx cond diff" x="34.0" y="842.0" width="196.0" height="40.0" rx="7"/><text class="bt" x="132.0" y="859.8" text-anchor="middle">mode · contacts</text><text class="bs dw" x="132.0" y="873.8" text-anchor="middle">MD or non-MD token · contacts</text></g><path class="ln f" d="M132.0,842.0 L132.0,816.0" marker-end="url(#bioemu2-a)"/><g class="blk" data-k="msa"><rect class="bx pair diff" x="50.0" y="770.0" width="180.0" height="46.0" rx="7"/><text class="bt" x="140.0" y="790.8" text-anchor="middle">MSA module</text><text class="bs dw" x="140.0" y="804.8" text-anchor="middle">4 blocks · no triangle attention</text></g><path class="ln f" d="M140.0,770.0 L140.0,758.0" marker-end="url(#bioemu2-a)"/><g class="blk" data-k="pairmixer"><rect class="bx pair diff" x="50.0" y="712.0" width="180.0" height="46.0" rx="7"/><text class="bt" x="140.0" y="726.5" text-anchor="middle">PairMixer</text><text class="bs dw" x="140.0" y="740.5" text-anchor="middle">48 blocks · triangle mult. only</text><text class="bs dw" x="140.0" y="753.0" text-anchor="middle">z 256 ch · s not updated</text></g><rect class="grp" x="24.0" y="678.0" width="216.0" height="154.0" rx="11"/><text class="gl" x="34.0" y="702.0" text-anchor="start">trunk · once per target</text><rect class="rep ink" x="34.0" y="669.0" width="76.0" height="18" rx="9"/><text class="rep-t ink-t" x="72.0" y="682.0" text-anchor="middle">× 4 passes</text><path class="ln f dsh" d="M38.0,718.0 C4.0,734.0 4.0,788.0 48.0,804.0" marker-end="url(#bioemu2-a)"/><path class="ln f" d="M196.0,712.0 L196.0,653.0" marker-end="url(#bioemu2-a)"/><g class="blk" data-k="c"><rect class="pl ink" x="152.8" y="637.0" width="86.3" height="16" rx="8"/><text class="pl-t ink-t" x="196.0" y="648.5" text-anchor="middle">c = (s<tspan class="sc" baseline-shift="-22%">i</tspan>, z<tspan class="sc" baseline-shift="-22%">ij</tspan>)</text></g><g class="blk" data-k="noise"><rect class="bx io" x="282.0" y="950.0" width="196.0" height="38.0" rx="7"/><text class="bt" x="380.0" y="966.8" text-anchor="middle">noise at σ<tspan class="sc" baseline-shift="-22%">max</tspan></text><text class="bs" x="380.0" y="980.8" text-anchor="middle">atom coordinates x</text></g><path class="ln f" d="M380.0,950.0 L380.0,924.0" marker-end="url(#bioemu2-a)"/><g class="blk" data-k="cond"><rect class="bx cond diff" x="292.0" y="876.0" width="176.0" height="48.0" rx="7"/><text class="bt" x="380.0" y="891.5" text-anchor="middle">conditioning</text><text class="bs dw" x="380.0" y="905.5" text-anchor="middle">s ⊕ Fourier(σ) ⊕ lag Δt → 768</text><text class="bs dw" x="380.0" y="918.0" text-anchor="middle">z ⊕ rel. pos. → 256 · cached</text></g><path class="ln f" d="M334.0,876.0 L334.0,864.0" marker-end="url(#bioemu2-a)"/><path class="ln f" d="M426.0,876.0 L426.0,864.0" marker-end="url(#bioemu2-a)"/><g class="blk" data-k="ain"><rect class="bx embed diff" x="292.0" y="824.0" width="84.0" height="40.0" rx="7"/><text class="bt sm" x="334.0" y="835.5" text-anchor="middle">atoms q</text><text class="bs dw" x="334.0" y="847.5" text-anchor="middle">x<tspan class="sc" baseline-shift="-22%">t</tspan> + reference</text><text class="bs dw" x="334.0" y="859.0" text-anchor="middle">(+ start frame)</text></g><g class="blk" data-k="tin"><rect class="bx embed diff" x="384.0" y="824.0" width="84.0" height="40.0" rx="7"/><text class="bt sm" x="426.0" y="835.5" text-anchor="middle">tokens a</text><text class="bs dw" x="426.0" y="847.5" text-anchor="middle">s<tspan class="sc" baseline-shift="38%">trunk</tspan> + x<tspan class="sc" baseline-shift="-22%">t</tspan></text><text class="bs dw" x="426.0" y="859.0" text-anchor="middle">of centre atom</text></g><path class="ln f" d="M334.0,824.0 L334.0,802.0" marker-end="url(#bioemu2-a)"/><path class="ln f" d="M426.0,824.0 L426.0,802.0" marker-end="url(#bioemu2-a)"/><g class="blk" data-k="aatt"><rect class="bx attn diff" x="292.0" y="762.0" width="84.0" height="38.0" rx="7"/><text class="bt sm" x="334.0" y="778.2" text-anchor="middle">atom attn</text><text class="bs dw" x="334.0" y="790.2" text-anchor="middle">window 32×128</text></g><g class="blk" data-k="tok"><rect class="bx attn diff" x="384.0" y="762.0" width="84.0" height="38.0" rx="7"/><text class="bt sm" x="426.0" y="778.2" text-anchor="middle">token attn</text><text class="bs dw" x="426.0" y="790.2" text-anchor="middle">pair bias z</text></g><path class="ln f" d="M334.0,762.0 L334.0,752.0" marker-end="url(#bioemu2-a)"/><path class="ln f" d="M426.0,762.0 L426.0,752.0" marker-end="url(#bioemu2-a)"/><g class="blk" data-k="amlp"><rect class="bx mlp" x="292.0" y="728.0" width="84.0" height="24.0" rx="7"/><text class="bt sm" x="334.0" y="743.0" text-anchor="middle">MLP · 128</text></g><g class="blk" data-k="tmlp"><rect class="bx mlp" x="384.0" y="728.0" width="84.0" height="24.0" rx="7"/><text class="bt sm" x="426.0" y="743.0" text-anchor="middle">MLP · 768</text></g><path class="ln f" d="M334.0,728.0 L334.0,716.0" marker-end="url(#bioemu2-a)"/><path class="ln f" d="M426.0,728.0 L426.0,716.0" marker-end="url(#bioemu2-a)"/><g class="blk" data-k="coup"><rect class="bx mlp diff" x="292.0" y="676.0" width="176.0" height="40.0" rx="7"/><text class="bt" x="380.0" y="693.8" text-anchor="middle">atom ↔ token coupling</text><text class="bs dw" x="380.0" y="707.8" text-anchor="middle">via each token&#x27;s centre atom</text></g><rect class="grp" x="286.0" y="644.0" width="188.0" height="168.0" rx="11"/><text class="gl" x="296.0" y="659.0" text-anchor="start">dual-stream layer</text><rect class="rep" x="428.4" y="635.0" width="37.6" height="18" rx="9"/><text class="rep-t" x="447.2" y="648.0" text-anchor="middle">× 16</text><path class="ln f" d="M334.0,676.0 L334.0,632.0" marker-end="url(#bioemu2-a)"/><path class="ln f" d="M426.0,676.0 L426.0,632.0" marker-end="url(#bioemu2-a)"/><g class="blk" data-k="readout"><rect class="bx embed diff" x="292.0" y="592.0" width="176.0" height="40.0" rx="7"/><text class="bt" x="380.0" y="609.8" text-anchor="middle">readout</text><text class="bs dw" x="380.0" y="623.8" text-anchor="middle">token ⊕ atom → Δx per atom</text></g><rect class="grp" x="272.0" y="558.0" width="216.0" height="382.0" rx="11"/><text class="gl" x="282.0" y="582.0" text-anchor="start">denoiser D<tspan class="sc" baseline-shift="-22%">θ</tspan>(x, σ | c)</text><rect class="rep" x="282.0" y="549.0" width="133.6" height="18" rx="9"/><text class="rep-t" x="348.8" y="562.0" text-anchor="middle">× 200 steps · 425 M</text><path class="ln w dsh" d="M484.0,582.0 C504.0,598.0 504.0,906.0 476.0,926.0" marker-end="url(#bioemu2-aw)"/><text class="lab w vert" x="508.0" y="747.0" text-anchor="middle">x̂ → next x · Kabsch · η = 1 or 1.5</text><path class="ln w" d="M239.2,645.0 L252.0,645.0 L252.0,900.0 L292.0,900.0" marker-end="url(#bioemu2-aw)"/><path class="ln w dsh" d="M468.0,900.0 L480.0,900.0 L480.0,781.0 L468.0,781.0" marker-end="url(#bioemu2-aw)"/><path class="ln f" d="M444.0,592.0 L444.0,493.0" marker-end="url(#bioemu2-a)"/><g class="blk" data-k="xhat"><rect class="bx io" x="282.0" y="457.0" width="196.0" height="36.0" rx="7"/><text class="bt" x="380.0" y="472.8" text-anchor="middle">structure x̂</text><text class="bs" x="380.0" y="486.8" text-anchor="middle">all atoms · S samples</text></g><g class="blk" data-k="out"><rect class="bx io" x="150.0" y="367.0" width="220.0" height="40.0" rx="7"/><text class="bt" x="260.0" y="384.8" text-anchor="middle">ensemble or one structure</text><text class="bs" x="260.0" y="398.8" text-anchor="middle">η = 1 for ensembles, 1.5 for one</text></g><path class="ln f" d="M380.0,457.0 L380.0,387.0 L370.0,387.0" marker-end="url(#bioemu2-a)"/><rect class="grp" x="24.0" y="423.0" width="216.0" height="201.0" rx="11"/><text class="gl" x="34.0" y="438.0" text-anchor="start">what AF3 has here</text><text class="lab" x="132.0" y="496.5" text-anchor="middle">template module</text><text class="lab" x="132.0" y="514.5" text-anchor="middle">triangle attention</text><text class="lab" x="132.0" y="532.5" text-anchor="middle">attention on the single track</text><text class="lab" x="132.0" y="550.5" text-anchor="middle">confidence head</text><text class="lab vert halo" x="11.0" y="761.0" text-anchor="middle">recycle</text><text class="lab w vert halo" x="263.0" y="762.0" text-anchor="middle">c, cached once per target</text></svg>
