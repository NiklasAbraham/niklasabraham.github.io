<svg class="dg-svg" viewBox="0 527 520 473" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bioemu-title"><title id="bioemu-title">bioemu architecture</title><defs><marker id="bioemu-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ah" d="M0,1 L9,5 L0,9 z"/></marker><marker id="bioemu-aw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ah w" d="M0,1 L9,5 L0,9 z"/></marker></defs><g class="blk" data-k="input"><rect class="bx io" x="34.0" y="950.0" width="196.0" height="38.0" rx="7"/><text class="bt" x="132.0" y="966.8" text-anchor="middle">protein sequence</text><text class="bs" x="132.0" y="980.8" text-anchor="middle">one chain · no ligands</text></g><path class="ln f" d="M132.0,950.0 L132.0,936.0" marker-end="url(#bioemu-a)"/><g class="blk" data-k="msasearch"><rect class="bx embed" x="34.0" y="896.0" width="196.0" height="40.0" rx="7"/><text class="bt" x="132.0" y="913.8" text-anchor="middle">MSA search</text><text class="bs" x="132.0" y="927.8" text-anchor="middle">ColabFold MMseqs2 · no templates</text></g><path class="ln f" d="M132.0,896.0 L132.0,870.0" marker-end="url(#bioemu-a)"/><g class="blk" data-k="evo"><rect class="bx pair" x="50.0" y="824.0" width="180.0" height="46.0" rx="7"/><text class="bt" x="140.0" y="838.5" text-anchor="middle">AlphaFold 2 Evoformer</text><text class="bs" x="140.0" y="852.5" text-anchor="middle">48 blocks · weights frozen</text><text class="bs" x="140.0" y="865.0" text-anchor="middle">model 3 · no recycling</text></g><rect class="grp" x="24.0" y="790.0" width="216.0" height="96.0" rx="11"/><text class="gl" x="34.0" y="814.0" text-anchor="start">frozen AF2 · once per sequence</text><path class="ln f" d="M196.0,824.0 L196.0,765.0" marker-end="url(#bioemu-a)"/><g class="blk" data-k="c"><rect class="pl ink" x="152.8" y="749.0" width="86.3" height="16" rx="8"/><text class="pl-t ink-