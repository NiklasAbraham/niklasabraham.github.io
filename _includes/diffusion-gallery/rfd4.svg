<svg class="dg-svg" viewBox="0 392 520 746" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rfd4-title"><title id="rfd4-title">rfd4 architecture</title><defs><marker id="rfd4-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ah" d="M0,1 L9,5 L0,9 z"/></marker><marker id="rfd4-aw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ah w" d="M0,1 L9,5 L0,9 z"/></marker></defs><g class="blk" data-k="xt"><rect class="bx io" x="56.0" y="1050.0" width="124.0" height="38.0" rx="7"/><text class="bt sm" x="118.0" y="1066.2" text-anchor="middle">noised anchors x<tspan class="sc" baseline-shift="-22%">t</tspan></text><text class="bs" x="118.0" y="1078.2" text-anchor="middle">token anchors · clock t<tspan class="sc" baseline-shift="-22%">x</tspan></text></g><g class="blk" data-k="lt"><rect class="bx io diff" x="189.0" y="1050.0" width="124.0" height="38.0" rx="7"/><text class="bt sm" x="251.0" y="1066.2" text-anchor="middle">noised latents ℓ<tspan class="sc" baseline-shift="-22%">t</tspan></text><text class="bs dw" x="251.0" y="1078.2" text-anchor="middle">32 per token · clock t<tspan class="sc" baseline-shift="-22%">ℓ</tspan></text></g><g class="blk" data-k="conds"><rect class="bx cond" x="322.0" y="1050.0" width="124.0" height="38.0" rx="7"/><text class="bt sm" x="384.0" y="1066.2" text-anchor="middle">conditions</text><text class="bs" x="384.0" y="1078.2" text-anchor="middle">motifs · ligands · tasks</text></g><path class="ln f" d="M118.0,1050.0 L118.0,1036.0" marker-end="url(#rfd4-a)"/><path class="ln f" d="M251.0,1050.0 L251.0,1036.0" marker-end="url(#rfd4-a)"/><path class="ln w" d="M384.0,1050.0 L384.0,1036.0" marker-end="url(#rfd4-aw)"/><g class="blk" data-k="emb"><rect class="bx embed" x="56.0" y="996.0" width="390.0" height="40.0" rx="7"/><text class="bt" x="251.0" y="1013.8" text-anchor="middle">input embedder</text><text class="bs" x="251.0" y="1027.8" text-anchor="middle">s<tspan class="sc" baseline-shift="-22%">i</tspan>: 768 · z<tspan class="sc" baseline-shift="-22%">ij</tspan>: 384 · adaLN: 256</text></g><path class="ln f" d="M251.0,996.0 L251.0,938.0" marker-end="url(#rfd4-a)"/><g class="blk" data-k="hadamard"><rect class="bx pair diff" x="262.0" y="898.0" width="170.0" height="34.0" rx="7"/><text class="bt sm" x="347.0" y="912.2" text-anchor="middle">single → pair update</text><text class="bs dw" x="347.0" y="924.2" text-anchor="middle">a<tspan class="sc" baseline-shift="-22%">i</tspan> ⊙ b<tspan class="sc" baseline-shift="-22%">j</tspan> · every layer</text></g><path class="ln f" d="M347.0,898.0 L347.0,888.0" marker-end="url(#rfd4-a)"/><g class="blk" data-k="trimult"><rect class="bx pair diff" x="262.0" y="844.0" width="170.0" height="44.0" rx="7"/><text class="bt sm" x="347.0" y="857.5" text-anchor="middle">triangle multiplication</text><text class="bs dw" x="347.0" y="869.5" text-anchor="middle">outgoing + incoming</text><text class="bs dw" x="347.0" y="881.0" text-anchor="middle">every other layer</text></g><path class="ln f" d="M347.0,844.0 L347.0,834.0" marker-end="url(#rfd4-a)"/><g class="blk" data-k="ptrans"><rect class="bx mlp" x="262.0" y="808.0" width="170.0" height="26.0" rx="7"/><text class="bt sm" x="347.0" y="824.0" text-anchor="middle">pair transition</text></g><g class="blk" data-k="attn"><rect class="bx attn" x="70.0" y="888.0" width="170.0" height="44.0" rx="7"/><text class="bt sm" x="155.0" y="901.5" text-anchor="middle">self-attention</text><text class="bs" x="155.0" y="913.5" text-anchor="middle">12 heads × 64 · QK-norm</text><text class="bs" x="155.0" y="925.0" text-anchor="middle">pair bias β<tspan class="sc" baseline-shift="-22%">i</tspan>j · gated</text></g><path class="ln f" d="M155.0,888.0 L155.0,878.0" marker-end="url(#rfd4-a)"/><g class="blk" data-k="trans"><rect class="bx mlp" x="70.0" y="842.0" width="170.0" height="36.0" rx="7"/><text class="bt sm" x="155.0" y="857.2" text-anchor="middle">token transition</text><text class="bs" x="155.0" y="869.2" text-anchor="middle">SwiGLU · hidden 3072</text></g><path class="ln w" d="M240.0,926.0 L262.0,915.0" marker-end="url(#rfd4-aw)"/><path class="ln w dsh" d="M262.0,821.0 L251.0,821.0 L251.0,898.0 L240.0,898.0" marker-end="url(#rfd4-aw)"/><g class="blk" data-k="adaln"><rect class="bx norm" x="70.0" y="758.0" width="362.0" height="28.0" rx="7"/><text class="bt sm" x="251.0" y="769.2" text-anchor="middle">adaLN features</text><text class="bs" x="251.0" y="781.2" text-anchor="middle">t<tspan class="sc" baseline-shift="-22%">x</tspan>, t<tspan class="sc" baseline-shift="-22%">ℓ</tspan> · molecular conditions</text></g><rect class="grp" x="56.0" y="724.0" width="390.0" height="224.0" rx="11"/><text class="gl" x="66.0" y="748.0" text-anchor="start">trunk layer</text><rect class="rep" x="66.0" y="715.0" width="37.6" height="18" rx="9"/><text class="rep-t" x="84.8" y="728.0" text-anchor="middle">× 14</text><rect class="grp" x="32.0" y="666.0" width="438.0" height="310.0" rx="11"/><text class="lab" x="251.0" y="966.0" text-anchor="middle">recycled: s, z projected and added back to the input embeddings</text><path class="ln f dsh" d="M52.0,728.0 C26.0,748.0 26.0,936.0 50.0,954.0" marker-end="url(#rfd4-a)"/><path class="ln f" d="M251.0,724.0 L251.0,690.0"/><path class="ln f" d="M102.5,690.0 H399.5"/><g class="blk" data-k="vx"><rect class="bx mlp" x="56.5" y="588.0" width="92.0" height="54.0" rx="7"/><text class="bt sm" x="102.5" y="605.8" text-anchor="middle">coordinate</text><text class="bt sm" x="102.5" y="618.8" text-anchor="middle">velocity</text><text class="bs" x="102.5" y="630.8" text-anchor="middle">v<tspan class="sc" baseline-shift="-22%">x</tspan> · N<tspan class="sc" baseline-shift="-22%">tok</tspan> × 3</text></g><path class="ln f" d="M102.5,690.0 L102.5,642.0" marker-end="url(#rfd4-a)"/><g class="blk" data-k="vl"><rect class="bx mlp" x="155.5" y="588.0" width="92.0" height="54.0" rx="7"/><text class="bt sm" x="201.5" y="605.8" text-anchor="middle">latent</text><text class="bt sm" x="201.5" y="618.8" text-anchor="middle">velocity</text><text class="bs" x="201.5" y="630.8" text-anchor="middle">v<tspan class="sc" baseline-shift="-22%">ℓ</tspan> · N<tspan class="sc" baseline-shift="-22%">tok</tspan> × 32</text></g><path class="ln f" d="M201.5,690.0 L201.5,642.0" marker-end="url(#rfd4-a)"/><g class="blk" data-k="seqhead"><rect class="bx attn diff dash" x="254.5" y="588.0" width="92.0" height="54.0" rx="7"/><text class="bt sm" x="300.5" y="605.8" text-anchor="middle">sequence</text><text class="bt sm" x="300.5" y="618.8" text-anchor="middle">head</text><text class="bs dw" x="300.5" y="630.8" text-anchor="middle">147 classes</text></g><path class="ln f dsh" d="M300.5,690.0 L300.5,642.0" marker-end="url(#rfd4-a)"/><g class="blk" data-k="mapping"><rect class="bx attn diff dash" x="353.5" y="588.0" width="92.0" height="54.0" rx="7"/><text class="bt sm" x="399.5" y="605.8" text-anchor="middle">motif</text><text class="bt sm" x="399.5" y="618.8" text-anchor="middle">mapping</text><text class="bs dw" x="399.5" y="630.8" text-anchor="middle">motif tokens</text></g><path class="ln f dsh" d="M399.5,690.0 L399.5,642.0" marker-end="url(#rfd4-a)"/><rect class="rep ink" x="206.6" y="657.0" width="88.8" height="18" rx="9"/><text class="rep-t ink-t" x="251.0" y="670.0" text-anchor="middle">× 1–9 passes</text><rect class="grp" x="18.0" y="542.0" width="466.0" height="584.0" rx="11"/><text class="gl" x="28.0" y="566.0" text-anchor="start">flow step at times t<tspan class="sc" baseline-shift="-22%">x</tspan>, t<tspan class="sc" baseline-shift="-22%">ℓ</tspan></text><rect class="rep" x="28.0" y="533.0" width="76.0" height="18" rx="9"/><text class="rep-t" x="66.0" y="546.0" text-anchor="middle">× 60 steps</text><path class="ln w dsh" d="M484.0,582.0 C510.0,612.0 510.0,1070.0 476.0,1100.0"/><path class="ln w dsh" d="M476.0,1100.0 L118.0,1100.0"/><path class="ln w dsh" d="M118.0,1100.0 L118.0,1091.0" marker-end="url(#rfd4-aw)"/><path class="ln w dsh" d="M251.0,1100.0 L251.0,1091.0" marker-end="url(#rfd4-aw)"/><text class="lab w" x="251.0" y="1116.0" text-anchor="middle">next x<tspan class="sc" baseline-shift="-22%">t</tspan>, ℓ<tspan class="sc" baseline-shift="-22%">t</tspan>: stochastic TSR update, both clocks advance</text><path class="ln f" d="M201.5,542.0 L201.5,512.0" marker-end="url(#rfd4-a)"/><path class="ln f dsh" d="M300.5,588.0 L300.5,512.0" marker-end="url(#rfd4-a)"/><g class="blk" data-k="dec"><rect class="bx latent diff" x="76.0" y="466.0" width="350.0" height="46.0" rx="7"/><text class="bt" x="251.0" y="480.5" text-anchor="middle">decoder</text><text class="bs dw" x="251.0" y="494.5" text-anchor="middle">12 layers × 12 heads × 768 · no pair track</text><text class="bs dw" x="251.0" y="507.0" text-anchor="middle">anchors + latents + sequence → atoms</text></g><path class="ln f" d="M251.0,466.0 L251.0,444.0" marker-end="url(#rfd4-a)"/><g class="blk" data-k="out"><rect class="bx io" x="76.0" y="404.0" width="350.0" height="40.0" rx="7"/><text class="bt" x="251.0" y="421.8" text-anchor="middle">all-atom design</text><text class="bs" x="251.0" y="435.8" text-anchor="middle">backbone · rotamers · ligand pose · sequence</text></g><text class="lab halo" x="243.0" y="707.0" text-anchor="end">final s<tspan class="sc" baseline-shift="-22%">i</tspan></text><text class="lab halo" x="193.5" y="522.0" text-anchor="end">x<tspan class="sc" baseline-shift="-22%">0</tspan>, ℓ<tspan class="sc" baseline-shift="-22%">0</tspan> after the last step</text></svg>
