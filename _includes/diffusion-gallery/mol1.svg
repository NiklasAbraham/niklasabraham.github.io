<svg class="dg-svg" viewBox="0 305 520 695" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mol1-title"><title id="mol1-title">mol1 architecture</title><defs><marker id="mol1-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ah" d="M0,1 L9,5 L0,9 z"/></marker><marker id="mol1-aw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ah w" d="M0,1 L9,5 L0,9 z"/></marker></defs><g class="blk" data-k="input"><rect class="bx io" x="34.0" y="950.0" width="196.0" height="38.0" rx="7"/><text class="bt" x="132.0" y="973.0" text-anchor="middle">sequences + ligand SMILES</text></g><path class="ln f" d="M132.0,950.0 L132.0,936.0" marker-end="url(#mol1-a)"/><g class="blk" data-k="emb"><rect class="bx embed" x="34.0" y="896.0" width="196.0" height="40.0" rx="7"/><text class="bt" x="132.0" y="913.8" text-anchor="middle">input embedder</text><text class="bs" x="132.0" y="927.8" text-anchor="middle">atoms → tokens · 3 blocks</text></g><path class="ln f" d="M132.0,896.0 L132.0,870.0" marker-end="url(#mol1-a)"/><g class="blk" data-k="tmpl"><rect class="bx pair diff" x="50.0" y="824.0" width="180.0" height="46.0" rx="7"/><text class="bt" x="140.0" y="844.8" text-anchor="middle">template module</text><text class="bs dw" x="140.0" y="858.8" text-anchor="middle">2 blocks · 448-ch z</text></g><path class="ln f" d="M140.0,824.0 L140.0,812.0" marker-end="url(#mol1-a)"/><g class="blk" data-k="msa"><rect class="bx pair diff" x="50.0" y="766.0" width="180.0" height="46.0" rx="7"/><text class="bt" x="140.0" y="786.8" text-anchor="middle">MSA module</text><text class="bs dw" x="140.0" y="800.8" text-anchor="middle">4 blocks · c<tspan class="sc" baseline-shift="-22%">m</tspan> = 192 · 31 M</text></g><path class="ln f" d="M140.0,766.0 L140.0,754.0" marker-end="url(#mol1-a)"/><g class="blk" data-k="pmix"><rect class="bx pair diff" x="50.0" y="708.0" width="180.0" height="46.0" rx="7"/><text class="bt" x="140.0" y="722.5" text-anchor="middle">PairMixer</text><text class="bs dw" x="140.0" y="736.5" text-anchor="middle">8 blocks · 448-ch z · 59 M</text><text class="bs dw" x="140.0" y="749.0" text-anchor="middle">no triangle attention</text></g><path class="ln f" d="M140.0,708.0 L140.0,696.0" marker-end="url(#mol1-a)"/><g class="blk" data-k="down"><rect class="bx embed diff" x="50.0" y="670.0" width="180.0" height="26.0" rx="7"/><text class="bt sm" x="140.0" y="686.0" text-anchor="middle">linear 448 → 320</text></g><path class="ln f" d="M140.0,670.0 L140.0,658.0" marker-end="url(#mol1-a)"/><g class="blk" data-k="pf"><rect class="bx pair diff" x="50.0" y="612.0" width="180.0" height="46.0" rx="7"/><text class="bt" x="140.0" y="632.8" text-anchor="middle">Pairformer</text><text class="bs dw" x="140.0" y="646.8" text-anchor="middle">40 blocks · 320-ch z · 240 M</text></g><path class="ln f" d="M140.0,612.0 L140.0,600.0" marker-end="url(#mol1-a)"/><g class="blk" data-k="up"><rect class="bx embed diff" x="50.0" y="574.0" width="180.0" height="26.0" rx="7"/><text class="bt sm" x="140.0" y="590.0" text-anchor="middle">linear 320 → 448</text></g><rect class="grp" x="24.0" y="540.0" width="216.0" height="346.0" rx="11"/><text class="gl" x="34.0" y="564.0" text-anchor="start">trunk · once per target</text><rect class="rep ink" x="34.0" y="531.0" width="82.4" height="18" rx="9"/><text class="rep-t ink-t" x="75.2" y="544.0" text-anchor="middle">× 20 passes</text><path class="ln f dsh" d="M38.0,580.0 C4.0,596.0 4.0,842.0 48.0,858.0" marker-end="url(#mol1-a)"/><path class="ln f" d="M196.0,574.0 L196.0,515.0" marker-end="url(#mol1-a)"/><g class="blk" data-k="c"><rect class="pl ink" x="152.8" y="499.0" width="86.3" height="16" rx="8"/><text class="pl-t ink-t" x="196.0" y="510.5" text-anchor="middle">c = (s<tspan class="sc" baseline-shift="-22%">i</tspan>, z<tspan class="sc" baseline-shift="-22%">ij</tspan>)</text></g><g class="blk" 