<svg class="dg-svg" viewBox="0 0 700 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="da-sandwich-title"><title id="da-sandwich-title">da sandwich</title><defs><marker id="da-sandwich-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ah" d="M0,1 L9,5 L0,9 z"/></marker><marker id="da-sandwich-aw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ah w" d="M0,1 L9,5 L0,9 z"/></marker></defs><g transform="translate(0,-228.0)"><g class="blk" data-k="x"><rect class="bx io" x="190.0" y="648.0" width="280.0" height="40.0" rx="7"/><text class="bt" x="330.0" y="665.8" text-anchor="middle">noisy atom positions x</text><text class="bs" x="330.0" y="679.8" text-anchor="middle">N<tspan class="sc" baseline-shift="-22%">atom</tspan> × 3, at noise level σ</text></g><path class="ln f" d="M330.0,648.0 L330.0,634.0" marker-end="url(#da-sandwich-a)"/><g class="blk" data-k="scale"><rect class="bx norm" x="230.0" y="608.0" width="200.0" height="26.0" rx="7"/><text class="bt sm" x="330.0" y="624.0" text-anchor="middle">r = x / √(σ<tspan class="sc" baseline-shift="38%">2</tspan> + σ<tspan class="sc" baseline-shift="-22%">d</tspan><tspan class="sc" baseline-shift="38%">2</tspan>)</text></g><path class="ln f" d="M330.0,608.0 L330.0,594.0" marker-end="url(#da-sandwich-a)"/><g class="blk" data-k="enc"><rect class="bx attn" x="120.0" y="530.0" width="420.0" height="64.0" rx="7"/><text class="bt" x="330.0" y="547.2" text-anchor="middle">atom encoder · 3 blocks</text><text class="bs" x="330.0" y="561.2" text-anchor="middle">local attention: 32 atoms see 128 neighbours</text><text class="bs" x="330.0" y="573.8" text-anchor="middle">features from the reference conformer, s<tspan class="sc" baseline-shift="38%">trunk</tspan>, z</text><text class="bs" x="330.0" y="586.2" text-anchor="middle">≈ 1 M parameters</text></g><path class="ln f" d="M330.0,530.0 L330.0,496.0" marker-end="url(#da-sandwich-a)"/><text class="lab" x="338.0" y="516.0" text-anchor="start">average each token&#x27;s atoms → one 768-number vector</text><g class="blk" data-k="tok"><rect class="bx attn" x="205.0" y="420.0" width="250.0" height="76.0" rx="7"/><text class="bt" x="330.0" y="443.2" text-anchor="middle">token transformer · 24 blocks</text><text class="bs" x="330.0" y="457.2" text-anchor="middle">global attention over all tokens</text><text class="bs" x="330.0" y="469.8" text-anchor="middle">logit + pair bias from z · AdaLN from s</text><text class="bs" x="330.0" y="482.2" text-anchor="middle">≈ 198 M parameters · 70–90 % of the time</text></g><rect class="pl ink" x="562.0" y="427.0" width="86.3" height="16" rx="8"/><text class="pl-t ink-t" x="605.1" y="438.5" text-anchor="middle">z → pair bias</text><path class="ln f" d="M560.0,438.0 L455.0,438.0" marker-end="url(#da-sandwich-a)"/><g class="blk" data-k="cond"><rect class="bx cond" x="562.0" y="456.0" width="128.0" height="28.0" rx="7"/><text class="bt sm" x="626.0" y="473.0" text-anchor="middle">s + Fourier(σ) → AdaLN</text></g><path class="ln w dsh" d="M560.0,470.0 L455.0,470.0" marker-end="url(#da-sandwich-aw)"/><path class="ln f" d="M330.0,420.0 L330.0,386.0" marker-end="url(#da-sandwich-a)"/><text class="lab" x="338.0" y="406.0" text-anchor="start">copy each token back to its atoms</text><g class="blk" data-k="dec"><rect class="bx attn" x="120.0" y="322.0" width="420.0" height="64.0" rx="7"/><text class="bt" x="330.0" y="339.2" text-anchor="middle">atom decoder · 3 blocks</text><text class="bs" x="330.0" y="353.2" text-anchor="middle">local attention again</text><text class="bs" x="330.0" y="365.8" text-anchor="middle">position update for every atom</text><text class="bs" x="330.0" y="378.2" text-anchor="middle">≈ 1 M parameters</text></g><path class="ln r" d="M120.0,562.0 C80.0,550.0 80.0,366.0 120.0,354.0" marker-end="url(#da-sandwich-a)"/><text class="lab vert" x="86.0" y="458.0" text-anchor="middle">skip: atom features</text><path class="ln f" d="M330.0,322.0 L330.0,308.0" marker-end="url(#da-sandwich-a)"/><g class="blk" data-k="out"><rect class="bx io" x="190.0" y="268.0" width="280.0" height="40.0" rx="7"/><text class="bt" x="330.0" y="285.8" text-anchor="middle">D<tspan class="sc" baseline-shift="-22%">θ</tspan> = c<tspan class="sc" baseline-shift="-22%">skip</tspan> x + c<tspan class="sc" baseline-shift="-22%">out</tspan> · update</text><text class="bs" x="330.0" y="299.8" text-anchor="middle">the denoised guess x̂</text></g><path class="ln r dsh" d="M190.0,668.0 C28.0,630.0 28.0,308.0 190.0,288.0" marker-end="url(#da-sandwich-a)"/><text class="lab vert" x="46.0" y="518.0" text-anchor="middle">x itself, weighted by c<tspan class="sc" baseline-shift="-22%">skip</tspan></text><text class="gl vert" x="16.0" y="562.0" text-anchor="middle">atoms · fine</text><text class="gl vert" x="16.0" y="458.0" text-anchor="middle">tokens · coarse</text><text class="gl vert" x="16.0" y="354.0" text-anchor="middle">atoms · fine</text><rect class="grp" x="30.0" y="246.0" width="640.0" height="448.0" rx="11"/><text class="gl" x="40.0" y="261.0" text-anchor="start">one call of the denoiser</text><rect class="rep" x="575.0" y="237.0" width="87.0" height="18" rx="9"/><text class="rep-t" x="618.5" y="250.5" text-anchor="middle">× 200 steps</text></g></svg>
