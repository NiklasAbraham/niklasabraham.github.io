<svg class="dg-svg" viewBox="0 0 760 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="da-atomwin-title"><title id="da-atomwin-title">da atomwin</title><defs><marker id="da-atomwin-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ah" d="M0,1 L9,5 L0,9 z"/></marker><marker id="da-atomwin-aw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ah w" d="M0,1 L9,5 L0,9 z"/></marker></defs><rect x="168.0" y="50" width="336.0" height="50" rx="8" style="fill:var(--dg-attn-f);fill-opacity:0.45;stroke:var(--dg-attn-s);stroke-dasharray:6 4;stroke-width:1.6"/><rect class="bx io" x="44.0" y="60" width="80" height="30" rx="5"/><text class="bs" x="84.0" y="79.0" text-anchor="middle">atoms 0–31</text><rect class="bx io" x="128.0" y="60" width="80" height="30" rx="5"/><text class="bs" x="168.0" y="79.0" text-anchor="middle">atoms 32–63</text><rect class="bx io" x="212.0" y="60" width="80" height="30" rx="5"/><text class="bs" x="252.0" y="79.0" text-anchor="middle">atoms 64–95</text><rect class="bx attn" x="296.0" y="60" width="80" height="30" rx="5"/><text class="bs" x="336.0" y="79.0" text-anchor="middle">atoms 96–127</text><rect class="bx io" x="380.0" y="60" width="80" height="30" rx="5"/><text class="bs" x="420.0" y="79.0" text-anchor="middle">atoms 128–159</text><rect class="bx io" x="464.0" y="60" width="80" height="30" rx="5"/><text class="bs" x="504.0" y="79.0" text-anchor="middle">atoms 160–191</text><rect class="bx io" x="548.0" y="60" width="80" height="30" rx="5"/><text class="bs" x="588.0" y="79.0" text-anchor="middle">atoms 192–223</text><rect class="bx io" x="632.0" y="60" width="80" height="30" rx="5"/><text class="bs" x="672.0" y="79.0" text-anchor="middle">atoms 224–255</text><text class="bt sm" x="336.0" y="40.0" text-anchor="middle">these 32 query atoms attend to the 128 key atoms around them (shaded)</text><text class="lab" x="336.0" y="120.0" text-anchor="middle">and add a bias p<tspan class="sc" baseline-shift="-22%">lm</tspan>: reference-conformer offset + z of the two atoms&#x27; tokens</text><rect class="bx attn" x="84.0" y="170" width="54" height="24" rx="5"/><text class="bs" x="111.0" y="186.0" text-anchor="middle">token 1</text><rect class="bx attn" x="146.0" y="170" width="54" height="24" rx="5"/><text class="bs" x="173.0" y="186.0" text-anchor="middle">token 2</text><rect class="bx attn" x="208.0" y="170" width="54" height="24" rx="5"/><text class="bs" x="235.0" y="186.0" text-anchor="middle">token 3</text><rect class="bx attn" x="270.0" y="170" width="54" height="24" rx="5"/><text class="bs" x="297.0" y="186.0" text-anchor="middle">token 4</text><rect class="bx attn" x="332.0" y="170" width="54" height="24" rx="5"/><text class="bs" x="359.0" y="186.0" text-anchor="middle">token 5</text><rect class="bx attn" x="394.0" y="170" width="54" height="24" rx="5"/><text class="bs" x="421.0" y="186.0" text-anchor="middle">token 6</text><rect class="bx attn" x="456.0" y="170" width="54" height="24" rx="5"/><text class="bs" x="483.0" y="186.0" text-anchor="middle">token 7</text><rect class="bx attn" x="518.0" y="170" width="54" height="24" rx="5"/><text class="bs" x="545.0" y="186.0" text-anchor="middle">token 8</text><rect class="bx attn" x="580.0" y="170" width="54" height="24" rx="5"/><text class="bs" x="607.0" y="186.0" text-anchor="middle">token 9</text><rect class="bx attn" x="642.0" y="170" width="54" height="24" rx="5"/><text class="bs" x="669.0" y="186.0" text-anchor="middle">token 10</text><text class="lab" x="404.0" y="156.0" text-anchor="middle">the encoder averages each token&#x27;s atoms (≈ 8 per residue) into one 768-number token vector</text><text class="lab" x="404.0" y="216.0" text-anchor="middle">the decoder copies every token vector back to its atoms and runs the same windows again</text></svg>
