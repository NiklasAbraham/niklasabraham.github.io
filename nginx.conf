server {
    listen 80;
    server_name niklas-abraham.de;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets (the long reads ship JSON data files of several hundred KB)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # No access log: visits are not recorded (see /datenschutz/)
    access_log off;

    # Jekyll generates directory-style URLs (e.g. /blog/ -> /blog/index.html)
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    # Cache static assets
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|avif|pdf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
