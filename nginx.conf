server {
    listen 80;
    server_name niklas-abraham.de;

    root /usr/share/nginx/html;
    index index.html;

    # Jekyll generates directory-style URLs (e.g. /blog/ -> /blog/index.html)
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    # Cache static assets
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|avif|pdf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
