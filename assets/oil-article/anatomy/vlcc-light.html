const M = (() => { // Truth for the VLCC freight figure. Every number the page shows comes from here.
// Pure module: imported by build.mjs (Node) and inlined into the page (live code).

// Ship. Typical modern VLCC (e.g. the 300,000-320,000 dwt designs built in Korea and China):
// length overall ~330 m, beam ~60 m, design (scantling) draught ~22 m, moulded depth ~31 m.
// Sources: class/yard particulars of standard VLCC designs; round numbers, approximate.
const LOA_M = 330;          // length overall, m (approximate)
const BEAM_M = 60;          // moulded beam, m (approximate)
const DRAUGHT_M = 22;       // design draught, m (approximate)
const DEPTH_M = 31;         // moulded depth to main deck, m (approximate)
const DWT_T = 300_000;      // deadweight, tonnes (class name: "VLCC" is 200-320 kt dwt)

// Cargo tanks: 5 rows x 3 (port wing, centre, starboard wing) plus two slop tanks aft,
// the usual double-hull VLCC arrangement (MARPOL double hull: double sides and double bottom ~2-3 m).
const TANK_ROWS = 5;
const TANK_ACROSS = 3;
const SLOP_TANKS = 2;
const DOUBLE_HULL_M = 3;    // width of double side / height of double bottom, m (approximate)

// Voyage. Ras Tanura (Saudi Arabia) -> Ningbo (China), the benchmark Middle East Gulf -> China VLCC route
// (TD3C). ~6,000 nautical miles laden at ~13 knots is ~20 days at sea.
const LADEN_DAYS = 20;      // laden leg, days (approximate)
const SPEED_KN = 13;        // service speed laden, knots (approximate)
// Round trip: the charterer pays hire for the whole cycle, laden leg + ballast leg back + port time and canal-free
// waiting: ~20 + ~20 + ~10 days. Round number, the caption says so.
const VOYAGE_DAYS = 50;

// Day rate range for the control: time-charter-equivalent (TCE) earnings.
const RATE_MIN = 30_000;      // $/day, a weak market floor (approximate)
const RATE_MAX = 1_300_000;   // $/day, record TCE reported for VLCCs in early October 2026 (Hormuz crisis)

// Hold points of the idle tour.
const HOLDS = [
  { rate: 70_000, note: "Jan 2026" },        // ~$70k/day in January 2026: freight ~ $1.7/bbl Gulf -> China
  { rate: 400_000, note: "mid-crisis" },     // a typical crisis-period level between the two
  { rate: 1_300_000, note: "record, Oct 2026" }, // record, early October 2026: freight ~ $33/bbl
];

// Crude price for comparison: WTI monthly average spot, EIA (assets/oil-article/oil.json, monthly.wti).
// Inlined at build time by build.mjs from oil.json; this default is the 2026-10 value.
const CRUDE_DEFAULT = { month: "2026-10", usd: 99.97 };

// Freight per barrel = day rate x days of hire / barrels carried.
// Excludes bunker fuel, port dues and war-risk insurance (the 2026 war-risk premium was a further cost).
const freightPerBbl = (rate) => (rate * VOYAGE_DAYS) / CARGO_BBL;
// Checks: 1,300,000 x 50 / 2,000,000 = 32.5 ; 70,000 x 50 / 2,000,000 = 1.75.

// Control mapping: the slider is a logarithmic day-rate scale (slide-rule style).
const shareOfRate = (rate) => Math.log(rate / RATE_MIN) / Math.log(RATE_MAX / RATE_MIN);
const rateOfShare = (share) => RATE_MIN * Math.pow(RATE_MAX / RATE_MIN, share);

// Dial: 0-40 $/bbl over 270 degrees.
const DIAL_MAX = 40;
const DIAL_SPAN_DEG = 270;

const fmtUsd = (value) => "$" + Math.round(value).toLocaleString("en-US");
const fmtBbl = (value) => "$" + (value < 10 ? value.toFixed(2) : value.toFixed(1));
function readout(rate, crude = CRUDE_DEFAULT.usd) {
  const f = freightPerBbl(rate);
  return `${fmtUsd(rate)} / day × ${VOYAGE_DAYS} days ÷ ${(CARGO_BBL / 1e6).toFixed(1)} m bbl = ${fmtBbl(f)} per barrel · ${Math.round((100 * f) / crude)}% of crude`;
}
; return { freightPerBbl, shareOfRate, rateOfShare, fmtUsd, fmtBbl, HOLDS, RATE_MIN, RATE_MAX, VOYAGE_DAYS, CARGO_BBL }; })();
const P = {"origin":[360.9301224059671,190.64764627161446],"scale":1.26323268460185,"azimuth":70,"elevation":30};
const CRUDE = {"month":"2026-10","usd":99.97};

const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const carriage = svg.querySelector('[data-part="carriage"]');

  if (counter.textContent !== fb) counter.textContent = fb;
  const shownRate = rate >= 100000 ? Math.round(rate / 10000) * 10000 : Math.round(rate / 1000) * 1000;
  const text = M.fmtUsd(shownRate) + " / day × " + M.VOYAGE_DAYS + " days ÷ " + (M.CARGO_BBL / 1e6).toFixed(1) + " m bbl\n= " + M.fmtBbl(M.freightPerBbl(shownRate)) + " per barrel · " + Math.round(100 * M.freightPerBbl(shownRate) / CRUDE.usd) + "% of $" + Math.round(CRUDE.usd) + " crude";

function tick(now) {

  share = still.matches ? target : share + (target - share) * (1 - Math.exp(-dt / 0.45));

const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
const steer = (next) => { touring = false; target = clamp(next, 0, 1); clearTimeout(idle); idle = setTimeout(() => { touring = !still.matches; clock = 0; run(); }, 4000); run(); };
new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);

});
stage.addEventListener("keydown", (event) => {
  const here = holds.reduce((best, h, i) => (Math.abs(h - target) < Math.abs(holds[best] - target) ? i : best), 0);

  if (event.key === "ArrowRight" || event.key === "ArrowUp") to = holds[Math.min(holds.length - 1, here + 1)];
  if (event.key === "ArrowLeft" || event.key === "ArrowDown") to = holds[Math.max(0, here - 1)];

  if (event.key === "End") to = 1;
