<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Distillation column</title><style>

}

  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;

}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}

.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>/* column figure: page styles (light only, the site's look) */
body{margin:0;background:#fff}
.iso-page{width:100%!important;max-width:720px;margin:0 auto!important}
.iso-figure{margin:0}
.iso-plate{padding:46px 20px 72px}
.iso-plate-corner[data-corner="hint"]{top:0;bottom:auto!important;left:auto;right:0}
.iso-plate-corner[data-corner="title"]{display:none}
.iso-plate-corner[data-corner="readout"]{left:0;white-space:normal;text-align:left;line-height:1.45;font-size:11px}
.cs-stage{--ink:#04204b;--blue:#0b4fc0;outline:none;touch-action:pan-y;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.cs-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:4px}
.cs-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* controls */
.cs-controls{display:flex;flex-direction:column;gap:8px;margin:0 0 10px}
.cs-chips,.cs-crudes{display:flex;flex-wrap:wrap;gap:5px}
.cs-chip,.cs-crude{font:inherit;font-size:12px;line-height:1;padding:6px 9px 6px 8px;border-radius:999px;border:1px solid #d9d9dc;background:#fff;color:#3a3a3e;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:border-color .3s,background .3s,color .3s}
.cs-chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.cs-chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:color-mix(in srgb,var(--c) 10%,#fff)}
.cs-crude span{color:#8c8c90}
.cs-crude[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.cs-crudes::before{content:"Crude";font-size:11px;color:#8c8c90;align-self:center;margin-right:2px}
.cs-chip:focus-visible,.cs-crude:focus-visible,.cs-tag:focus-visible{outline:1px solid var(--ink);outline-offset:2px}

/* art and HTML labels over it */
.cs-art,.cs-detail-art{position:relative}
.cs-art>svg,.cs-detail{display:block;width:100%;height:auto}
.cs-over{position:absolute;inset:0;pointer-events:none}
.cs-tag{position:absolute;transform:translateY(-50%);pointer-events:auto;text-align:left;font:inherit;background:none;border:0;padding:2px 4px 2px 2px;margin:0;cursor:pointer;display:flex;flex-direction:column;gap:1px;color:#57575a;opacity:.78;transition:opacity .3s}
.cs-tag-name{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:#26262a;white-space:nowrap}
.cs-tag-name::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.cs-icon{width:12px;height:12px;fill:none;stroke:#8a8a8f;stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round;order:2}
.cs-tag-sub{font-size:10.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cs-tag-use{font-size:10.5px;color:#8c8c90;white-space:nowrap}
.cs-short{display:none}
.cs-tag[data-on]{opacity:1}
.cs-tag[data-on] .cs-tag-name{color:var(--ink)}
.cs-tag-feed{transform:translate(-4%,-150%)}
.cs-tag-feed .cs-tag-use{display:none}
.cs-rule-n{position:absolute;transform:translateY(-50%);font-size:10px;color:#8a8a8f;white-space:nowrap;font-variant-numeric:tabular-nums;padding-right:2px}
.cs-rule-end{color:#26262a}

/* detail panel */
.cs-detail-wrap{margin-top:14px;border-top:1px solid #e5e5e2;padding-top:10px}
.cs-detail-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;font-size:12px;line-height:1.4;margin-bottom:6px}
.cs-detail-title{color:#26262a;font-weight:600}
.cs-detail-chem{color:#57575a}
.cs-dl{position:absolute;transform:translate(var(--a),-50%);font-size:10.5px;color:#3a3a3e;white-space:nowrap;background:color-mix(in srgb,#fbfbfa 75%,transparent);padding:0 2px;border-radius:2px}
.cs-dl-dim{color:#8c8c90}
.cs-mol-tag{position:absolute;transform:translate(-50%,-140%);font-size:10px;white-space:nowrap;padding:1px 4px;border-radius:3px;background:#fff;box-shadow:0 0 0 1px #e1e1e3;color:#3a3a3e;transition:opacity .4s;opacity:0}
.cs-mol-tag[data-show]{opacity:1}

@media (max-width:560px){
  .iso-plate{padding:42px 8px 96px}
  .cs-art{margin:0 -6px}
  .cs-tag-use,.cs-tag-sub,.cs-full{display:none}
  .cs-short{display:inline}
  .cs-tag-name{font-size:10.5px;gap:3px}
  .cs-tag-feed .cs-tag-sub{display:block;font-size:9.5px}
  .cs-icon{display:none}
  .cs-rule-n{font-size:9px}
  .cs-dl{font-size:9px}
  .cs-mol-tag{font-size:8.5px}
  .cs-chip,.cs-crude{font-size:11px;padding:5px 7px}
}

/* ---- SVG: heater ---- */
.cs-cavity{fill:#4a4540}
.cs-brick{stroke:#6b625a!important}
.cs-hearth{fill:#4a433b}.cs-tile{fill:#5b5147}
.cs-glow{fill:#e08a3c;opacity:.35;filter:blur(6px)}
.cs-coil .iso-fill,.cs-coil .iso-shade,.cs-coil .iso-top{fill:#2b2723}
.cs-coil .iso-edge{stroke:#1d1a17}
.cs-flame{fill:#f0a040;opacity:.92;animation:cs-flick 1.3s ease-in-out infinite alternate}
@keyframes cs-flick{0%{transform:scale(1,1)}50%{transform:scale(1.04,.93)}100%{transform:scale(.97,1.06)}}

/* ---- SVG: pipes tinted by what they carry ---- */
.it[data-flow] .tb-body{fill:color-mix(in srgb,var(--c) 16%,var(--anatomy-paper))}
.it[data-flow] .tb-shine{fill:color-mix(in srgb,var(--c) 8%,#fff)}
.it[data-flow] .tb-shade{fill:color-mix(in srgb,var(--c) 28%,var(--anatomy-shade-0))}
.it[data-flow][data-on] .tb-body{fill:color-mix(in srgb,var(--c) 34%,var(--anatomy-paper))}
.it[data-flow="crude"]{--c:#b4552f}.it[data-flow="steam"]{--c:#0b4fc0}.it[data-flow="vapour"]{--c:#c99a1e}.it[data-flow="overhead"]{--c:#c99a1e}
.it[data-flow="gas"]{--c:#c99a1e}.it[data-flow="lnap"]{--c:#3f9f8c}.it[data-flow="hnap"]{--c:#138374}.it[data-flow="kero"]{--c:#8a93a6}
.it[data-flow="diesel"]{--c:#6a47c2}.it[data-flow="hgo"]{--c:#b58a5e}.it[data-flow="resid"]{--c:#4e3b2c}
.it[data-flow="steam"] .tb-body{fill:color-mix(in srgb,#0b4fc0 12%,var(--anatomy-paper))}
.cs-core{fill:none;stroke:color-mix(in srgb,var(--c) 70%,#fff);stroke-width:var(--w,2px);stroke-linecap:butt;vector-effect:none!important;transition:stroke-width .9s var(--anatomy-ease),stroke .4s}
.it[data-on] .cs-core{stroke:var(--c)}
.it[data-on] .iso-edge{stroke:var(--anatomy-hi)}

/* ---- SVG: the section ---- */
.cs-in{--anatomy-shade-0:#d2d1cc;--anatomy-shade-1:#dbdad5;--anatomy-shade-2:#e4e3de;--anatomy-shade-3:#ecebe7}
.cs-cut{fill:#ffffff}
.cs-port{fill:#c9c7c1}
.cs-liq-top{fill:color-mix(in srgb,var(--c) 22%,#fff)}
.cs-liq-cut{fill:color-mix(in srgb,var(--c) 38%,#fff)}
.cs-dense .cs-liq-cut{fill:color-mix(in srgb,var(--c) 70%,#fff)}
.cs-dense .cs-liq-top{fill:color-mix(in srgb,var(--c) 45%,#fff)}
.cs-liq-line{stroke:color-mix(in srgb,var(--c) 70%,#555)!important}
.cs-liq[data-on] .cs-liq-cut{fill:color-mix(in srgb,var(--c) 70%,#fff)}
.cs-liq[data-on] .cs-liq-line{stroke:#000!important;stroke-width:1.1px}
.cs-ripple{fill:none;stroke:color-mix(in srgb,var(--c) 55%,#fff);stroke-width:.6;animation:cs-ripple 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes cs-ripple{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.15);opacity:0}}
.cs-flow{fill:none;stroke:color-mix(in srgb,var(--c) 75%,#333);stroke-width:.6;stroke-dasharray:2 5;opacity:.55;animation:cs-dash 2.2s linear infinite}
.cs-fall{fill:none;stroke:color-mix(in srgb,#04204b 40%,#fff);stroke-width:.6;stroke-dasharray:2 4;animation:cs-dash 1.2s linear infinite}
@keyframes cs-dash{to{stroke-dashoffset:-14}}
.cs-spill{fill:none;stroke:color-mix(in srgb,var(--c) 55%,#fff);stroke-width:2;stroke-linecap:round}
.cs-capb .iso-fill{fill:#fff}
.cs-capin{fill:#f4f3ef}
.cs-slot{fill:color-mix(in srgb,#04204b 8%,#fff)}
.cs-bub,.cs-vap{fill:#fff;stroke:#8a8a8f;stroke-width:.5;animation:cs-rise 1.2s linear infinite}
.cs-vap{animation-duration:2.4s}
.cs-steam{fill:#fff;stroke:#0b4fc0;stroke-width:.5;opacity:.8;animation:cs-rise 1.8s linear infinite}
@keyframes cs-rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(calc(-1 * var(--rise)));opacity:0}}
.cs-rain{fill:color-mix(in srgb,#b4552f 70%,#fff);animation:cs-fall 1s linear infinite}
@keyframes cs-fall{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(var(--fall));opacity:0}}
.cs-steam-pipe .tb-body{fill:color-mix(in srgb,#0b4fc0 14%,#fff)}
.cs-feed-pipe .tb-body{fill:color-mix(in srgb,#b4552f 22%,#fff)}
.cs-reflux-pipe .tb-body{fill:color-mix(in srgb,#3f9f8c 22%,#fff)}

/* ---- SVG: the rule ---- */
.cs-band{fill:var(--c,transparent);opacity:.55;transition:opacity .4s}
.cs-band-mark{fill:none;stroke:#000;stroke-width:1.4px;stroke-linecap:butt}
.cs-guide{fill:none;stroke:#04204b;stroke-width:.7px;stroke-dasharray:1.5 2.5;opacity:.7}

/* ---- detail panel ---- */
.cs-dvap{fill:#f6f6f3}
.cs-dliq-body{fill:color-mix(in srgb,var(--dc,#8a93a6) 34%,#fff);transition:fill .6s}
.cs-dcut{fill:url(#cs-hatch);stroke:#8a8a8f;stroke-width:.7}
.cs-hatch-bg{fill:#fff}.cs-hatch-line{stroke:#c4c4c8;stroke-width:1}
.cs-dcapin{fill:#f6f6f3}
.cs-dslot{fill:color-mix(in srgb,var(--dc,#8a93a6) 34%,#fff);stroke:none}
.cs-dflow{fill:none;stroke:color-mix(in srgb,var(--dc,#8a93a6) 70%,#333);stroke-width:.8;stroke-dasharray:3 6;opacity:.5;animation:cs-dash 1.6s linear infinite}

"6" height="12"/><path class="cs-dcut" d="M188 80 V132 H193 V80 Z M251 80 V132 H256 V80 Z"/><rect class="cs-dcapin" x="339" y="85" width="58" height="47"/><rect class="cs-dcapin" x="354" y="98" width="28" height="138"/><rect class="cs-dcut" x="349" y="98" width="5" height="65"/><rect class="cs-dcut" x="382" y="98" width="5" height="65"/><path class="cs-dcut" d="M334 144 V80 H402 V144 H397 V85 H339 V144 Z"/><rect class="cs-dcut" x="334" y="144" width="5" height="3"/><rect class="cs-dcut" x="397" y="144" width="5" height="3"/><rect class="cs-dslot" x="333.5" y="132" width="6" height="12"/><rect class="cs-dslot" x="396.5" y="132" width="6" height="12"/><path class="cs-dcut" d="M334 80 V132 H339 V80 Z M397 80 V132 H402 V80 Z"/></g><g class="cs-dmove" data-dmove></g></svg><div class="cs-over"><span class="cs-dl cs-dl-in" style="left:36.67%;top:44.92%;--a:-50%">riser</span><span class="cs-dl" style="left:61.33%;top:31.36%;--a:-50%">cap</span><span class="cs-dl" style="left:69.67%;top:56.78%;--a:0">slots</span><span class="cs-dl" style="left:78.33%;top:47.46%;--a:-100%">weir</span><span class="cs-dl" style="left:87.33%;top:84.75%;--a:0">downcomer</span><span class="cs-dl" style="left:7.67%;top:9.32%;--a:0">liquid from the tray above</span><span class="cs-dl cs-dl-dim" style="left:36.67%;top:92.37%;--a:-50%">vapour from the tray below</span><span class="cs-mol-tag" data-moltag="light"></span><span class="cs-mol-tag" data-moltag="heavy"></span></div></div></div><span class="cs-sr" role="status" aria-live="polite" data-status></span></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Rule: column temperature at each height (approximate), band = boiling range of the product picked</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Liquid on each tray tinted by the cut that boils at that tray's temperature</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Stream width in the rundown lines: square root of the crude's yield (wt %)</span></span><span class="iso-caption">A crude distillation column cut open (schematic: 15 trays drawn, a real column has 35–50, spaced 60–75 cm). The heater takes the crude to about 343–371 °C (OSHA) and up to half of it flashes to vapour in the flash zone; there is no reboiler, so the column is hottest at the bottom and cools upward as rising vapour meets liquid running down. On every tray the vapour bubbles through the liquid: heavier molecules condense, lighter ones stay in the vapour. Each product is drawn where the column is about as warm as its boiling range. Draw temperatures (about 104 °C at the top to 346 °C at the feed) are one example design from a patent (approximate); cut points are TotalEnergies assay cuts, with the gasoil split at 321 °C as in Penn State's FSC 432; carbon numbers are the n-alkanes that boil in each range (NIST, ASTM D2887). Yields: Brent TotalEnergies TBP assay, WCS crudemonitor.ca simulated distillation (Sep 2026, approximate).</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];

const along = (path, d) => {

  for (let i = 0; i < path.seg.length; i++) {
    if (left <= path.seg[i]) { const f = left / path.seg[i]; const a = path.pts[i]; const b = path.pts[i + 1]; return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]; }
    left -= path.seg[i];
  }
  return path.pts[path.pts.length - 1];
};
const bubbles = [];
paths.forEach((path, i) => {
  for (let j = 0; j < 5; j++) {
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("class", "cs-dbub");
    c.setAttribute("r", (2.2 + ((i + j) % 3) * 0.7).toFixed(1));
    dmove.appendChild(c);
    bubbles.push({ c, path, phase: (j / 5 + i * 0.13) % 1 });
  }
});
function glyph(n, color) {
  const g = document.createElementNS(NS, "g");
  g.setAttribute("class", "cs-mol");
  g.style.setProperty("--mc", color);
  const step = 6.2;
  const pts = Array.from({ length: n }, (_, i) => [(i - (n - 1) / 2) * step * 0.87, (i % 2 ? -1 : 1) * step * 0.25]);
  for (let i = 1; i < n; i++) {
    const l = document.createElementNS(NS, "line");
    l.setAttribute("x1", pts[i - 1][0].toFixed(1)); l.setAttribute("y1", pts[i - 1][1].toFixed(1));
    l.setAttribute("x2", pts[i][0].toFixed(1)); l.setAttribute("y2", pts[i][1].toFixed(1));
    g.appendChild(l);
  }
  for (const [x, y] of pts) {
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x.toFixed(1)); c.setAttribute("cy", y.toFixed(1)); c.setAttribute("r", "1.9");
    g.appendChild(c);
  }
  dmove.appendChild(g);
  return g;
}
let mols = null;
const trayOf = (id) => {
  if (id === "feed") return { title: "Tray 1, just above the flash zone", T: byId.hgo.drawT };
  const p = byId[id];
  if (p.where === "overhead") return { title: `Top tray, where ${p.name.toLowerCase()} leaves as vapour`, T: p.drawT };
  if (p.where === "bottom") return { title: "Bottom stripping tray, above the residue", T: p.drawT };
  return { title: `${p.name} draw tray`, T: p.drawT };
};
function paintDetail(id) {
  const t = trayOf(id);
  const chem = trayChem(t.T);
  const color = id === "feed" ? byId.hgo.color : byId[id].color;
  detailArt.style.setProperty("--dc", color);
  dtitle.textContent = `${t.title} · about ${Math.round(t.T)} °C`;
  const cap = (s) => s[0].toUpperCase() + s.slice(1);
  dchem.textContent = `${cap(chem.light.name)} C${chem.light.n} boils at ${deg(chem.light.tb)} °C: stays in the vapour · ${chem.heavy.name} C${chem.heavy.n} boils at ${deg(chem.heavy.tb)} °C: condenses`;
  if (mols) { mols.light.g.remove(); mols.heavy.g.remove(); }
  mols = { light: { g: glyph(chem.light.n, "#c99a1e"), n: chem.light.n, name: chem.light.name }, heavy: { g: glyph(chem.heavy.n, "#4e3b2c"), n: chem.heavy.n, name: chem.heavy.name } };
  tags.light.textContent = `C${chem.light.n} · rises`;
  tags.heavy.textContent = `C${chem.heavy.n} · condenses`;
  frameDetail(clock);
}
// one cycle: both molecules ride a vapour bubble up the riser and out of the slots; then the light one goes on up,
// the heavy one stays in the liquid and drifts toward the weir
const CYCLE = 7;
function frameDetail(t) {
  for (const b of bubbles) {
    const d = (((t / 4.2 + b.phase) % 1) + 1) % 1;
    const [x, y] = along(b.path, d * b.path.total);
    b.c.setAttribute("cx", x.toFixed(1));
    b.c.setAttribute("cy", y.toFixed(1));
    b.c.setAttribute("opacity", (Math.min(1, d * 8, (1 - d) * 6)).toFixed(2));
  }
  if (!mols) return;
  const f = (((t / CYCLE) % 1) + 1) % 1;
  const pl = paths[1]; // right side of the first cap
  const ph = paths[3]; // right side of the second cap
  const slotAt = (path) => {
    let acc = 0;
    for (let i = 0; i < 4; i++) acc += path.seg[i];
    return acc + path.seg[4] * 0.6;
  };
  // light: whole path
  const dl = f * pl.total;
  const [lx, ly] = along(pl, dl);
  mols.light.g.setAttribute("transform", `translate(${lx.toFixed(1)} ${ly.toFixed(1)})`);
  mols.light.g.setAttribute("opacity", Math.min(1, f * 10, (1 - f) * 10).toFixed(2));
  // heavy: to the slot, then into the liquid and along it
  const sh = slotAt(ph);
  const g0 = Math.min(1, f / 0.55);
  let hx;
  let hy;
  if (f < 0.55) [hx, hy] = along(ph, g0 * sh);
  else {
    const [sx, sy] = along(ph, sh);
    const e = (f - 0.55) / 0.45;
    hx = sx + e * 40;
    hy = sy + (DATA.detail.deck - 8 - sy) * Math.min(1, e * 2.5);
  }
  mols.heavy.g.setAttribute("transform", `translate(${hx.toFixed(1)} ${hy.toFixed(1)})`);
  mols.heavy.g.setAttribute("opacity", Math.min(1, f * 10, (1 - f) * 8).toFixed(2));
  // tags follow the molecules once they part
  const place = (tag, x, y, show) => {
    tag.style.left = `${((x / DATA.DW) * 100).toFixed(2)}%`;
    tag.style.top = `${((y / DATA.DH) * 100).toFixed(2)}%`;
    tag.toggleAttribute("data-show", show);
  };
  place(tags.light, lx, ly, f > 0.62 && f < 0.95);
  place(tags.heavy, hx, hy, f > 0.66 && f < 0.95);
}

// ---- picking ----
function say() {
  const text = pick === "feed" ? feedReadout(crudes[crude]) : readout(byId[pick], crudes[crude]);
  if (out.textContent !== text) out.textContent = text;
  return text;
}
function select(id, { user = true } = {}) {
  pick = id;
  stage.querySelectorAll(".cs-chip").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.pick === id)));
  stage.querySelectorAll(".cs-tag").forEach((b) => b.toggleAttribute("data-on", b.dataset.pick === id));
  svg.querySelectorAll(".it[data-flow], .it[data-pick]").forEach((g) => g.toggleAttribute("data-on", g.dataset.flow === id || g.dataset.pick === id || (id === "feed" && g.dataset.flow === "crude") || ((id === "gas" || id === "lnap") && g.dataset.flow === "overhead")));
  const liqKey = id === "gas" || id === "lnap" ? "top" : id;
  svg.querySelectorAll(".cs-liq").forEach((g) => g.toggleAttribute("data-on", g.dataset.liq === id || g.dataset.tray === liqKey));
  paintRule(id);
  paintDetail(id);
  const text = say();
  if (user) status.textContent = text;
}

// ---- motion: the magnified tray runs while visible; the drawing's own CSS motion pauses offscreen ----
let clock = 0;
let last = 0;
let frame = 0;
let visible = false;
let touring = !still.matches;
let tourClock = 0;
let idle = 0;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60;
  last = now;
  if (!still.matches) {
    clock += dt;
    frameDetail(clock);
    if (touring) {
      tourClock += dt;
      if (tourClock > 5) { tourClock = 0; select(ORDER[(ORDER.indexOf(pick) + 1) % ORDER.length], { user: false }); }
    }
  }
  frame = visible && !still.matches ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible && !still.matches) { last = 0; frame = requestAnimationFrame(tick); } };
const hold = () => {
  touring = false;
  clearTimeout(idle);
  idle = setTimeout(() => { touring = !still.matches; tourClock = 0; }, 9000);
};
new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  stage.toggleAttribute("data-run", visible && !still.matches);
  if (visible) run();
}, { rootMargin: "80px 0px" }).observe(stage);

stage.addEventListener("click", (event) => {
  const crudeBtn = event.target.closest("[data-crude]");
  if (crudeBtn) { hold(); crude = Number(crudeBtn.dataset.crude); paintCrude(); say(); status.textContent = say(); return; }
  const el = event.target.closest("[data-pick]");
  if (el && stage.contains(el)) { hold(); select(el.dataset.pick); }
});
stage.addEventListener("pointerover", (event) => {
  const el = event.target.closest(".cs-tag, .it[data-pick]");
  if (el && el.dataset.pick !== pick && event.pointerType === "mouse") { hold(); select(el.dataset.pick); }
});
stage.addEventListener("keydown", (event) => {
  let to = null;
  const i = ORDER.indexOf(pick);
  if (event.key === "ArrowRight" || event.key === "ArrowDown") to = i + 1;
  if (event.key === "ArrowLeft" || event.key === "ArrowUp") to = i - 1;
  if (event.key === "Home") to = 0;
  if (event.key === "End") to = ORDER.length - 1;
  if (to === null || event.target.closest("button")) return;
  event.preventDefault();
  hold();
  select(ORDER[(to + ORDER.length) % ORDER.length]);
});
if (still.matches) touring = false;
paintCrude();
select("kero", { user: false });
frameDetail(5.6);

// tell the embedding post how tall this page is
const post = () => parent.postMessage({ oilFig: "column", h: Math.ceil(document.body.getBoundingClientRect().height) }, "*");
addEventListener("load", post);
addEventListener("resize", post);
post();
</script></body></html>
