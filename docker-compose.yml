services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # Main site (apex)
      - "traefik.http.routers.personalsite.rule=Host(`niklas-abraham.de`)"
      - "traefik.http.routers.personalsite.entrypoints=websecure"
      - "traefik.http.routers.personalsite.tls=true"
      - "traefik.http.routers.personalsite.tls.certresolver=letsencrypt"
      - "traefik.http.services.personalsite.loadbalancer.server.port=80"
      # Redirect www -> apex
      - "traefik.http.routers.personalsite-www.rule=Host(`www.niklas-abraham.de`)"
      - "traefik.http.routers.personalsite-www.entrypoints=websecure"
      - "traefik.http.routers.personalsite-www.tls=true"
      - "traefik.http.routers.personalsite-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.personalsite-www.middlewares=personalsite-redirect-www"
      - "traefik.http.middlewares.personalsite-redirect-www.redirectregex.regex=^https://www\\.niklas-abraham\\.de(.*)"
      - "traefik.http.middlewares.personalsite-redirect-www.redirectregex.replacement=https://niklas-abraham.de$${1}"
      - "traefik.http.middlewares.personalsite-redirect-www.redirectregex.permanent=true"

networks:
  proxy:
    external: true
